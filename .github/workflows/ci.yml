name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full validation before a release or merge'
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
    contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    check:
        timeout-minutes: 30
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        name: Build, vet, lint and test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build
              if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.full
              run: go build ./...

            - name: Vet
              if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.full
              run: go vet ./...

            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l . | grep -v '^to-delete/' || true)
                  if [ -n "$unformatted" ]; then
                      echo "These files are not gofmt'ed:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Staticcheck
              if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.full
              run: |
                  go install honnef.co/go/tools/cmd/staticcheck@latest
                  staticcheck ./...

            - name: Unreachable code
              if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.full
              run: |
                  go install golang.org/x/tools/cmd/deadcode@latest
                  output=$(deadcode -test ./...)
                  if [ -n "$output" ]; then
                      echo "Unreachable functions:"
                      echo "$output"
                      exit 1
                  fi

            # The panel is heavily concurrent (cron jobs, WebSocket hub, xray
            # process management), so the race detector is the point of this job.
            - name: Test with the race detector
              if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.full
              run: go test -race -count=1 ./...
