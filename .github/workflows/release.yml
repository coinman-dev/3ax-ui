name: Release 3AX-UI

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
    analyze:
        name: Analyze Go code
        permissions:
            contents: read
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                    echo "These files are not gofmt-formatted:"
                    echo "$unformatted"
                    exit 1
                  fi

            - name: Run go vet
              run: go vet ./...

            - name: Run staticcheck
              run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

            - name: Run tests
              run: go test -race -shuffle=on ./...

    build:
        timeout-minutes: 90
        needs: analyze
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        strategy:
            # Don't let one flaky arch (e.g. a transient download failure)
            # cancel the others — each platform builds/uploads independently.
            fail-fast: false
            matrix:
                platform:
                    - amd64
                    - arm64
                    - armv7
                    - armv6
                    - 386
                    - armv5
                    - s390x
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  check-latest: true

            - name: Build 3X-UI
              run: |
                  # Make GitHub / 3rd-party downloads resilient to anonymous
                  # rate-limits and transient 5xx — the "server issued an error
                  # response" (wget exit 8) that broke a release build. Plain
                  # --tries only retries network errors, so also retry on HTTP
                  # error codes. Applies to every wget below via ~/.wgetrc.
                  cat > "$HOME/.wgetrc" <<'WGETRC'
                  tries = 5
                  waitretry = 15
                  retry_connrefused = on
                  retry_on_http_error = 429,500,502,503,504
                  WGETRC
                  export CGO_ENABLED=1
                  export GOOS=linux
                  export GOARCH=${{ matrix.platform }}
                  # Use Bootlin prebuilt cross-toolchains (musl 1.2.5 in stable series)
                  case "${{ matrix.platform }}" in
                    amd64) BOOTLIN_ARCH="x86-64" ;;
                    arm64) BOOTLIN_ARCH="aarch64" ;;
                    armv7) BOOTLIN_ARCH="armv7-eabihf"; export GOARCH=arm GOARM=7 ;;
                    armv6) BOOTLIN_ARCH="armv6-eabihf"; export GOARCH=arm GOARM=6 ;;
                    armv5) BOOTLIN_ARCH="armv5-eabi"; export GOARCH=arm GOARM=5 ;;
                    386) BOOTLIN_ARCH="x86-i686" ;;
                    s390x) BOOTLIN_ARCH="s390x-z13" ;;
                  esac
                  echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
                  TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
                  TARBALL_URL=$(curl -fsSL "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
                  [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
                  echo "Downloading: $TARBALL_URL"
                  cd /tmp
                  curl -fL -sS -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
                  tar -xf "$(basename "$TARBALL_URL")"
                  TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
                  export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
                  export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
                  [ -z "$CC" ] && { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }
                  cd -
                  BUILD_VERSION="${{ github.ref_name }}"
                  [ -z "$BUILD_VERSION" ] && BUILD_VERSION=$(cat config/version)
                  go build -ldflags "-w -s -linkmode external -extldflags '-static' -X 'github.com/coinman-dev/3ax-ui/v2/config.version=${BUILD_VERSION}'" -o xui-release -v main.go
                  file xui-release
                  ldd xui-release || echo "Static binary confirmed"

                  mkdir x-ui
                  cp xui-release x-ui/
                  cp x-ui.service.debian x-ui/
                  cp x-ui.service.arch x-ui/
                  cp x-ui.service.rhel x-ui/
                  cp x-ui.sh x-ui/
                  mv x-ui/xui-release x-ui/x-ui
                  mkdir x-ui/bin
                  cd x-ui/bin

                  # Download dependencies
                  Xray_URL="https://github.com/XTLS/Xray-core/releases/download/v26.3.27/"
                  if [ "${{ matrix.platform }}" == "amd64" ]; then
                    wget -q ${Xray_URL}Xray-linux-64.zip
                    unzip Xray-linux-64.zip
                    rm -f Xray-linux-64.zip
                  elif [ "${{ matrix.platform }}" == "arm64" ]; then
                    wget -q ${Xray_URL}Xray-linux-arm64-v8a.zip
                    unzip Xray-linux-arm64-v8a.zip
                    rm -f Xray-linux-arm64-v8a.zip
                  elif [ "${{ matrix.platform }}" == "armv7" ]; then
                    wget -q ${Xray_URL}Xray-linux-arm32-v7a.zip
                    unzip Xray-linux-arm32-v7a.zip
                    rm -f Xray-linux-arm32-v7a.zip
                  elif [ "${{ matrix.platform }}" == "armv6" ]; then
                    wget -q ${Xray_URL}Xray-linux-arm32-v6.zip
                    unzip Xray-linux-arm32-v6.zip
                    rm -f Xray-linux-arm32-v6.zip
                  elif [ "${{ matrix.platform }}" == "386" ]; then
                    wget -q ${Xray_URL}Xray-linux-32.zip
                    unzip Xray-linux-32.zip
                    rm -f Xray-linux-32.zip
                  elif [ "${{ matrix.platform }}" == "armv5" ]; then
                    wget -q ${Xray_URL}Xray-linux-arm32-v5.zip
                    unzip Xray-linux-arm32-v5.zip
                    rm -f Xray-linux-arm32-v5.zip
                  elif [ "${{ matrix.platform }}" == "s390x" ]; then
                    wget -q ${Xray_URL}Xray-linux-s390x.zip
                    unzip Xray-linux-s390x.zip
                    rm -f Xray-linux-s390x.zip
                  fi
                  rm -f geoip.dat geosite.dat
                  wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
                  wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
                  wget -q -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
                  wget -q -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
                  wget -q -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
                  wget -q -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
                  mv xray xray-linux-${{ matrix.platform }}

                  # MTProto sidecar. amd64/arm64 get the multi-user mtg-multi fork
                  # (dolonet/mtg-multi, latest release — many client secrets on one
                  # port); other arches get single-secret mtg (github.com/9seconds/mtg).
                  # s390x has neither prebuilt → MTProto unavailable there.
                  case "${{ matrix.platform }}" in
                    amd64) MM_ARCH="amd64" ;;
                    arm64) MM_ARCH="arm64" ;;
                    *) MM_ARCH="" ;;
                  esac
                  MM_DONE=""
                  if [ -n "$MM_ARCH" ]; then
                    MM_VER=$(curl -fsSL "https://api.github.com/repos/dolonet/mtg-multi/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v?([^"]+)".*/\1/' | head -n1)
                    if [ -n "$MM_VER" ] && wget -q "https://github.com/dolonet/mtg-multi/releases/download/v${MM_VER}/mtg-multi-${MM_VER}-linux-${MM_ARCH}.tar.gz"; then
                      tar -xzf "mtg-multi-${MM_VER}-linux-${MM_ARCH}.tar.gz"
                      mv "mtg-multi-${MM_VER}-linux-${MM_ARCH}/mtg-multi" "mtg-multi-linux-${{ matrix.platform }}" 2>/dev/null || mv mtg-multi "mtg-multi-linux-${{ matrix.platform }}"
                      rm -rf "mtg-multi-${MM_VER}-linux-${MM_ARCH}" "mtg-multi-${MM_VER}-linux-${MM_ARCH}.tar.gz"
                      chmod +x "mtg-multi-linux-${{ matrix.platform }}"
                      MM_DONE="1"
                      echo "bundled mtg-multi ${MM_VER} (multi-user MTProto) for ${{ matrix.platform }}"
                    else
                      echo "mtg-multi download failed for ${{ matrix.platform }}; falling back to single-secret mtg"
                    fi
                  fi
                  if [ -z "$MM_DONE" ]; then
                    MTG_VER="2.2.8"
                    case "${{ matrix.platform }}" in
                      amd64) MTG_ARCH="amd64" ;;
                      arm64) MTG_ARCH="arm64" ;;
                      armv7) MTG_ARCH="armv7" ;;
                      armv6|armv5) MTG_ARCH="armv6" ;;
                      386) MTG_ARCH="386" ;;
                      *) MTG_ARCH="" ;;
                    esac
                    if [ -n "$MTG_ARCH" ]; then
                      if wget -q "https://github.com/9seconds/mtg/releases/download/v${MTG_VER}/mtg-${MTG_VER}-linux-${MTG_ARCH}.tar.gz"; then
                        tar -xzf "mtg-${MTG_VER}-linux-${MTG_ARCH}.tar.gz"
                        mv "mtg-${MTG_VER}-linux-${MTG_ARCH}/mtg" "mtg-linux-${{ matrix.platform }}" 2>/dev/null || mv mtg "mtg-linux-${{ matrix.platform }}"
                        rm -rf "mtg-${MTG_VER}-linux-${MTG_ARCH}" "mtg-${MTG_VER}-linux-${MTG_ARCH}.tar.gz"
                        chmod +x "mtg-linux-${{ matrix.platform }}"
                      else
                        echo "mtg download failed for ${MTG_ARCH}; MTProto unavailable on ${{ matrix.platform }}"
                      fi
                    else
                      echo "No prebuilt MTProto sidecar for ${{ matrix.platform }}; MTProto unavailable on this arch"
                    fi
                  fi
                  cd ../..

            - name: Package
              run: tar -zcvf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui

            - name: Upload files to Artifacts
              uses: actions/upload-artifact@v6
              with:
                  name: x-ui-linux-${{ matrix.platform }}
                  path: ./x-ui-linux-${{ matrix.platform }}.tar.gz
                  retention-days: 1

            - name: Upload files to GH release
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref_name }}
                  file: x-ui-linux-${{ matrix.platform }}.tar.gz
                  asset_name: x-ui-linux-${{ matrix.platform }}.tar.gz
                  overwrite: true
                  prerelease: ${{ contains(github.ref_name, '-') }}

    # =================================
    #  Windows Build
    # =================================
    build-windows:
        timeout-minutes: 90
        name: Build for Windows
        needs: analyze
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        strategy:
            matrix:
                platform:
                    - amd64
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  check-latest: true

            - name: Install MSYS2
              uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: >-
                      mingw-w64-x86_64-gcc
                      mingw-w64-x86_64-sqlite3
                      mingw-w64-x86_64-pkg-config

            - name: Build 3X-UI for Windows (CGO)
              shell: msys2 {0}
              run: |
                  export PATH="/c/hostedtoolcache/windows/go/$(ls /c/hostedtoolcache/windows/go | sort -V | tail -n1)/x64/bin:$PATH"

                  export CGO_ENABLED=1
                  export GOOS=windows
                  export GOARCH=amd64
                  export CC=x86_64-w64-mingw32-gcc

                  which go
                  go version
                  gcc --version

                  BUILD_VERSION="${{ github.ref_name }}"
                  if [ -z "$BUILD_VERSION" ]; then BUILD_VERSION=$(cat config/version); fi
                  go build -ldflags "-w -s -X 'github.com/coinman-dev/3ax-ui/v2/config.version=${BUILD_VERSION}'" -o xui-release.exe -v main.go

            - name: Copy and download resources
              shell: pwsh
              run: |
                  mkdir x-ui
                  Copy-Item xui-release.exe x-ui\x-ui.exe
                  mkdir x-ui\bin
                  cd x-ui\bin

                  # Download Xray for Windows
                  $Xray_URL = "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/"
                  Invoke-WebRequest -Uri "${Xray_URL}Xray-windows-64.zip" -OutFile "Xray-windows-64.zip"
                  Expand-Archive -Path "Xray-windows-64.zip" -DestinationPath .
                  Remove-Item "Xray-windows-64.zip"
                  Remove-Item geoip.dat, geosite.dat -ErrorAction SilentlyContinue
                  Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip.dat"
                  Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite.dat"
                  Invoke-WebRequest -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat" -OutFile "geoip_IR.dat"
                  Invoke-WebRequest -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat" -OutFile "geosite_IR.dat"
                  Invoke-WebRequest -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip_RU.dat"
                  Invoke-WebRequest -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite_RU.dat"
                  Rename-Item xray.exe xray-windows-amd64.exe

                  # Download mtg (MTProto FakeTLS sidecar) for Windows. mtg's
                  # Windows binary name is mtg-windows-amd64.exe (see the mtproto
                  # package). Non-fatal: a failure just leaves MTProto unavailable.
                  $MTG_VER = "2.2.8"
                  try {
                    Invoke-WebRequest -Uri "https://github.com/9seconds/mtg/releases/download/v${MTG_VER}/mtg-${MTG_VER}-windows-amd64.zip" -OutFile "mtg.zip"
                    Expand-Archive -Path "mtg.zip" -DestinationPath "mtg-extract"
                    $mtgExe = Get-ChildItem -Path "mtg-extract" -Recurse -Filter "mtg.exe" | Select-Object -First 1
                    if ($mtgExe) { Move-Item $mtgExe.FullName "mtg-windows-amd64.exe" -Force }
                    Remove-Item "mtg.zip", "mtg-extract" -Recurse -Force -ErrorAction SilentlyContinue
                  } catch {
                    Write-Host "mtg download failed; MTProto unavailable on Windows"
                  }
                  cd ..
                  Copy-Item -Path ..\windows_files\* -Destination . -Recurse
                  cd ..

            - name: Package to Zip
              shell: pwsh
              run: |
                  Compress-Archive -Path .\x-ui -DestinationPath "x-ui-windows-amd64.zip"

            - name: Upload files to Artifacts
              uses: actions/upload-artifact@v6
              with:
                  name: x-ui-windows-amd64
                  path: ./x-ui-windows-amd64.zip
                  retention-days: 1

            - name: Upload files to GH release
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref_name }}
                  file: x-ui-windows-amd64.zip
                  asset_name: x-ui-windows-amd64.zip
                  overwrite: true
                  prerelease: ${{ contains(github.ref_name, '-') }}
