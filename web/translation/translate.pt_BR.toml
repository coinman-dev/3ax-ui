"obfHint" = "Escolha uma geração e um preset, pressione Gerar e salve. Mudar a obfuscação muda para TODOS os clientes — eles precisam reimportar a configuração ou serão desconectados. H1-H4 aceitam um valor único (1.x) ou uma faixa como 100000-800000 (2.0). A 3.0 acrescenta criptografia de cabeçalho e temporizadores de protocolo aleatorizados; gerá-la também regenera o conjunto 2.0, porque a proteção de cabeçalho exige que S1-S4 sejam largos o bastante para carregar o nonce. Os clientes precisam de um aplicativo com suporte a 3.0."
