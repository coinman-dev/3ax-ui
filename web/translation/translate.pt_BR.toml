[pages.inbounds.mtproto]
"hint" = "MTProto é um proxy do Telegram executado por um sidecar mtg externo (não pelo Xray). Escolha uma porta pública e um domínio de fronting; o segredo FakeTLS é gerado ao salvar e compartilhado com um único link do Telegram."
"fakeTlsDomain" = "Domínio FakeTLS"
"fakeTlsDomainRandom" = "Escolher um domínio de fronting aleatório"
"secret" = "Segredo"
"route" = "Roteamento através do Xray"
"routeDesc" = "Conecte ao Telegram através do roteador do core em vez de sair diretamente. Use isto quando o Telegram estiver bloqueado neste servidor e você quiser sair por uma cadeia de outbound."
"outboundTag" = "Tag de outbound"
"outboundTagDesc" = "Tag do outbound (ou balanceador) do Xray para onde enviar o tráfego do Telegram deste proxy — por exemplo, uma cadeia até um servidor onde o Telegram esteja acessível. Deixe vazio para usar o outbound padrão."
"defense" = "Anti-bloqueio (mtg)"
"recommended" = "Configurações recomendadas"
"fillRecommended" = "Preencher valores recomendados"
"fillRecommendedDesc" = "Preenche tudo que tem um padrão defensável: o alvo de imitação (o domínio de fachada deste inbound), o intervalo de varredura e as repetições documentados pelo mtg, um resolvedor DNS-over-HTTPS, tolerância de desvio de relógio de 5s, o limite de 8192 conexões e os endereços públicos deste servidor — para que o mtg não precise pedi-los a um serviço externo ao iniciar. As duas defesas permanecem ligadas. Ficam por sua conta: o host e a porta de fachada (necessários apenas quando o DNS do domínio de fachada está bloqueado ou aponta de volta para este servidor), os dois interruptores de PROXY protocol (apenas atrás de NGINX ou de um balanceador), a preferência de IP (apenas quando o IPv6 está quebrado), o tamanho dinâmico de registros TLS (apenas se o site imitado o usa) e as listas de bloqueio (o mtg já traz a sua)."
"fillRecommendedDone" = "Valores recomendados preenchidos — verifique os campos e salve"
"defenseHint" = "Tudo abaixo é opcional e, se ficar vazio, não é escrito na configuração gerada, então o mtg mantém o próprio padrão. São os ajustes que importam quando a censura para de procurar assinaturas e começa a classificar por comportamento."
"frontingHost" = "Host de fachada"
"frontingHostDesc" = "Para onde é encaminhada uma conexão que não passa no handshake FakeTLS — uma sondagem ativa, ou qualquer um varrendo a porta. Sem isso o mtg simplesmente derruba a conexão, o que já é uma resposta reconhecível. Aponte para um site real (um NGINX local ou o próprio endereço do domínio de fachada). Vazio = o mtg resolve o domínio de fachada a partir do segredo."
"frontingHostPlaceholder" = "127.0.0.1 ou um nome de host"
"frontingPort" = "Porta de fachada"
"frontingProxyProtocol" = "PROXY protocol para o host de fachada"
"frontingProxyProtocolDesc" = "Falar PROXY protocol com o site de fachada para que ele veja o endereço real do cliente. Ative apenas se aquele site esperar por isso."
"proxyProtocolListener" = "Aceitar PROXY protocol"
"proxyProtocolListenerDesc" = "Ative quando este proxy estiver atrás de um stream do NGINX ou de um balanceador TCP — é assim que o MTProto compartilha a porta 443 com um site real no mesmo endereço. Não ative em conexões diretas: o handshake falharia."
"doppelganger" = "Imitação do formato do tráfego"
"doppelUrls" = "URLs a imitar"
"doppelUrlsDesc" = "Uma URL HTTPS por linha. O mtg as percorre e reproduz os atrasos entre os pacotes, de modo que o perfil temporal da sessão deixa de parecer um proxy e passa a parecer aquele site. O botão ↻ preenche o domínio de fachada; arquivos grandes de CDN dão estatísticas melhores. Vazio = o subsistema fica inativo."
"doppelUrlsFilled" = "Alvos de imitação preenchidos"
"doppelRepeats" = "Requisições por rodada"
"doppelRaidEach" = "Intervalo entre rodadas"
"doppelDrs" = "Tamanho dinâmico de registros TLS"
"doppelDrsDesc" = "Começa com registros TLS pequenos e vai aumentando, como fazem servidores em Go e o NGINX com patch. A maioria das pilhas (NGINX, Apache, OpenSSL) usa sempre o tamanho máximo, então ative apenas se o site imitado fizer isso."
"network" = "Rede"
"preferIp" = "Preferência de IP"
"preferIpDesc" = "Qual família de endereços o mtg usa para alcançar o Telegram. Fixe em only-ipv4 quando a rota IPv6 do servidor estiver quebrada ou filtrada."
"mtgDefault" = "padrão do mtg"
"dns" = "Resolvedor"
"dnsDesc" = "O mtg resolve o domínio de fachada por conta própria, não pelo resolvedor do sistema. Informe um endpoint DNS-over-HTTPS ou DNS-over-TLS (https://1.1.1.1, tls://1.1.1.1) quando a resposta local estiver envenenada. Vazio = o padrão do próprio mtg."
"timeSkew" = "Tolerância de desvio de relógio"
"timeSkewDesc" = "O FakeTLS carrega um carimbo de tempo criptografado e o mtg rejeita mensagens fora desta janela — é isso que barra sondagens reproduzidas. Aumente apenas se o relógio do servidor estiver desviando. Padrão 3s."
"concurrency" = "Máximo de conexões"
"concurrencyDesc" = "Quantas conexões simultâneas este proxy aceita; o restante é descartado. 0 = padrão do mtg (8192)."
"publicIpv4" = "IPv4 público"
"publicIpv6" = "IPv6 público"
"publicIpDesc" = "Os endereços acessíveis deste servidor. Em branco, o mtg os pede a um serviço externo ao iniciar — informe-os para evitar essa requisição por completo."
"autoDetect" = "detectar automaticamente"
"filters" = "Filtros"
"antiReplay" = "Cache anti-repetição"
"antiReplayDesc" = "Guarda os primeiros bytes de cada conexão e recusa repetições, que é como a sondagem ativa é derrotada. Ligado por padrão; raramente há motivo para desligar."
"blocklist" = "Lista de bloqueio de IP"
"blocklistDesc" = "Clientes das redes listadas nunca recebem handshake — são encaminhados ao site de fachada. Ligada por padrão com o FireHOL level 1, que inclui faixas privadas: desligue se você conecta da mesma rede local."
"blocklistUrls" = "URLs das listas de bloqueio"
"debug" = "Log de depuração"
"debugDesc" = "Saída do mtg muito detalhada. Ative apenas enquanto diagnostica algo."

