"notifyConfirm1" = "Enviar agora a nova configuração a cada cliente AWG vinculado ao Telegram?"
"notifyConfirm2" = "Faça isso depois de mudar o servidor para 2.0."
"notifyDone" = "Clientes notificados"
"s3Desc" = "AmneziaWG 2.0: preenchimento aleatório para pacotes Cookie (0-64). 0 mantém o comportamento 1.x."
"s4Desc" = "AmneziaWG 2.0: preenchimento aleatório para pacotes de dados (transporte) (0-32). 0 mantém o comportamento 1.x."
"i1Desc" = "AmneziaWG 2.0: pacote de assinatura CPS enviado antes de cada handshake, p. ex. <r 128> (N bytes aleatórios). Vazio mantém o comportamento 1.x."
"i2to5Desc" = "(I2-I5) pacotes de assinatura adicionais enviados antes do handshake, junto com o I1. O gerador dá a cada um os bytes iniciais de outro protocolo — QUIC, STUN, DTLS — para que o começo do fluxo seja lido como algo que a censura já deixa passar. Eles não precisam coincidir com o servidor: o receptor nunca os valida. Marcas: <b 0xHEX> bytes literais, <r N> bytes aleatórios, <c> contador, <t> carimbo de tempo. Campos vazios não são escritos, e um aplicativo anterior ao AmneziaVPN 5.18 os ignora."
"awg3Unsupported" = "O AmneziaWG deste servidor é antigo demais para a 3.0 — atualize o amneziawg-tools e o módulo do kernel. Instalado:"
"off" = "desligado"
"headerProtectionKeyDesc" = "AmneziaWG 3.0: chave base64 de 32 bytes que criptografa o cabeçalho do pacote (ChaCha20). O único parâmetro 3.0 que precisa coincidir nas duas pontas — sem ele o cliente não conecta. Exige que S1-S4 sejam de no mínimo 12. Vazio = desligado."
"contentPaddingAdditionDesc" = "AmneziaWG 3.0: preenchimento extra dentro da parte criptografada. Um valor único ou uma faixa como 8-48; o kernel escolhe um valor novo em cada sessão. Vazio = padrão do kernel."
"rekeyAfterTimeDesc" = "AmneziaWG 3.0: segundos até começar a renovação de chaves (padrão 120). Uma faixa como 100-130 faz o momento variar em cada sessão. Mantenha abaixo de RejectAfterTime."
"rekeyTimeoutDesc" = "AmneziaWG 3.0: segundos entre tentativas de handshake (padrão 5). Aceita uma faixa."
"rejectAfterTimeDesc" = "AmneziaWG 3.0: segundos até a sessão expirar (padrão 180). Aceita uma faixa. Deve ficar acima de RekeyAfterTime."
"keepaliveTimeoutDesc" = "AmneziaWG 3.0: segundos antes de um pacote keepalive (padrão 10). Aceita uma faixa."
"maxHandshakeAttemptsDesc" = "AmneziaWG 3.0: tentativas de handshake antes de desistir (padrão 18). Aceita uma faixa."
"randomTrailersDesc" = "AmneziaWG 3.0: acrescenta uma cauda aleatória aos pacotes, para que os tamanhos deixem de se repetir."
"disableCookiesDesc" = "AmneziaWG 3.0: desliga as respostas de cookie. Remove um tipo de pacote reconhecível, ao custo da proteção do WireGuard contra enxurradas de handshake."

