"hint" = "MTProto یک پروکسی Telegram است که توسط یک سرویس جانبی mtg خارجی اجرا می‌شود (نه Xray). یک پورت عمومی و یک دامنهٔ پوششی انتخاب کنید؛ راز FakeTLS هنگام ذخیره تولید شده و با یک لینک Telegram به اشتراک گذاشته می‌شود."
"fakeTlsDomain" = "دامنهٔ FakeTLS"
"fakeTlsDomainRandom" = "یک دامنهٔ پوششی تصادفی انتخاب کنید"
"secret" = "راز"
"route" = "مسیریابی از طریق Xray"
"routeDesc" = "به‌جای خروج مستقیم، Telegram را از طریق مسیریاب هسته فراخوانی کنید. زمانی از این گزینه استفاده کنید که Telegram روی این سرور مسدود است و می‌خواهید از طریق یک زنجیرهٔ outbound خروج داشته باشید."
"outboundTag" = "برچسب outbound"
"outboundTagDesc" = "برچسب outbound (یا متعادل‌کننده) Xray که ترافیک Telegram این پروکسی به آن ارسال می‌شود — برای مثال، زنجیره‌ای به سروری که Telegram در آن در دسترس است. برای استفاده از outbound پیش‌فرض خالی بگذارید."
"defense" = "ضد فیلترینگ (mtg)"
"recommended" = "تنظیمات پیشنهادی"
"fillRecommended" = "پر کردن مقادیر پیشنهادی"
"fillRecommendedDesc" = "هر چیزی که مقدار پیش‌فرض قابل دفاعی دارد پر می‌شود: هدف تقلید (دامنه پوششی این ورودی)، بازه پیمایش و تعداد تکرار مستندشده در mtg، یک حل‌کننده DNS-over-HTTPS، تحمل اختلاف زمانی ۵ ثانیه، سقف ۸۱۹۲ اتصال، و نشانی‌های عمومی این سرور — تا mtg هنگام راه‌اندازی آن‌ها را از سرویس بیرونی نپرسد. هر دو لایه دفاعی روشن می‌مانند. برای شما می‌ماند: میزبان و پورت پوشش (تنها زمانی لازم است که DNS دامنه پوششی مسدود باشد یا به همین سرور اشاره کند)، دو کلید PROXY protocol (تنها در پشت NGINX یا متعادل‌کننده بار)، ترجیح IP (تنها وقتی IPv6 خراب است)، اندازه پویای رکورد TLS (تنها اگر سایت تقلیدشده چنین کند) و نشانی فهرست‌های مسدودی (mtg فهرست خودش را دارد)."
"fillRecommendedDone" = "مقادیر پیشنهادی پر شد — فیلدها را بررسی و ذخیره کنید"
"defenseHint" = "همه موارد زیر اختیاری‌اند و اگر خالی بمانند در پیکربندی تولیدشده نوشته نمی‌شوند، پس mtg مقدار پیش‌فرض خود را نگه می‌دارد. این‌ها همان تنظیماتی هستند که وقتی سانسور از جست‌وجوی امضا به دسته‌بندی بر پایه رفتار می‌رسد اهمیت پیدا می‌کنند."
"frontingHost" = "میزبان پوشش"
"frontingHostDesc" = "اتصالی که در دست‌دهی FakeTLS رد شود — یک کاوشگر فعال یا هر کسی که پورت را پویش می‌کند — به کجا فرستاده شود. بدون آن mtg تنها اتصال را قطع می‌کند و همین قطع‌شدن خودش پاسخی قابل شناسایی است. به یک سایت واقعی اشاره دهید (یک NGINX محلی یا نشانی خود دامنه پوششی). خالی = mtg دامنه پوششی را از کلید محرمانه استخراج می‌کند."
"frontingHostPlaceholder" = "127.0.0.1 یا یک نام میزبان"
"frontingPort" = "پورت پوشش"
"frontingProxyProtocol" = "PROXY protocol به میزبان پوشش"
"frontingProxyProtocolDesc" = "با سایت پوششی به زبان PROXY protocol صحبت شود تا نشانی واقعی کاربر را ببیند. تنها اگر آن سایت انتظارش را دارد فعال کنید."
"proxyProtocolListener" = "پذیرش PROXY protocol"
"proxyProtocolListenerDesc" = "زمانی فعال کنید که این پروکسی پشت NGINX stream یا یک متعادل‌کننده بار TCP باشد — MTProto به همین شکل پورت ۴۴۳ را با یک سایت واقعی روی همان نشانی به اشتراک می‌گذارد. برای اتصال مستقیم فعال نکنید: دست‌دهی شکست می‌خورد."
