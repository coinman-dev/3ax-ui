"obfHint" = "Bir sürüm ve hazır ayar seçin, Üret'e basın ve kaydedin. Karartmayı değiştirmek TÜM istemciler için değiştirir — yapılandırmalarını yeniden içe almalıdırlar, yoksa bağlantıları kopar. H1-H4 tek bir değer (1.x) veya 100000-800000 gibi bir aralık (2.0) kabul eder. 3.0 başlık şifrelemesi ve rastgeleleştirilmiş protokol zamanlayıcıları ekler; onu üretmek 2.0 setini de yeniden üretir, çünkü başlık koruması S1-S4'ün nonce'u taşıyacak kadar geniş olmasını gerektirir. İstemcilerin 3.0 destekleyen bir uygulaması olmalıdır."
