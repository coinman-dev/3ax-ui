"i2to5Desc" = "(I2-I5) el sıkışmadan önce I1 ile birlikte gönderilen ek imza paketleri. Üretici her birine başka bir protokolün başlangıç baytlarını verir — QUIC, STUN, DTLS — böylece akışın başı sansürün zaten geçirdiği bir şey gibi okunur. Sunucuyla eşleşmeleri gerekmez; alıcı onları hiç doğrulamaz. Etiketler: <b 0xHEX> sabit baytlar, <r N> rastgele baytlar, <c> sayaç, <t> zaman damgası. Boş alanlar yazılmaz ve AmneziaVPN 5.18'den eski bir uygulama onları yok sayar."
