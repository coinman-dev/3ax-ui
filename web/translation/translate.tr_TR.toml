[pages.inbounds.mtproto]
"hint" = "MTProto, Xray yerine harici bir mtg yardımcı süreci tarafından çalıştırılan bir Telegram proxy'sidir. Bir genel port ve bir cephe alan adı seçin; FakeTLS gizli anahtarı kaydetme sırasında oluşturulur ve tek bir Telegram bağlantısıyla paylaşılır."
"fakeTlsDomain" = "FakeTLS Alan Adı"
"fakeTlsDomainRandom" = "Rastgele bir cephe alan adı seç"
"secret" = "Gizli Anahtar"
"route" = "Xray üzerinden yönlendir"
"routeDesc" = "Telegram'ı doğrudan dışarı çıkmak yerine çekirdeğin yönlendiricisi üzerinden bağlayın. Telegram bu sunucuda engellenmişse ve bir outbound zinciri üzerinden çıkış yapmak istiyorsanız bunu kullanın."
"outboundTag" = "Outbound etiketi"
"outboundTagDesc" = "Bu proxy'nin Telegram trafiğinin gönderileceği Xray outbound'unun (veya dengeleyicinin) etiketi — örneğin, Telegram'a erişilebilen bir sunucuya giden bir zincir. Varsayılan outbound'u kullanmak için boş bırakın."
"defense" = "Engelleme karşıtı (mtg)"
"recommended" = "Önerilen ayarlar"
"fillRecommended" = "Önerilen değerleri doldur"
"fillRecommendedDesc" = "Makul bir varsayılanı olan her şeyi doldurur: taklit hedefi (bu gelenin örtü alan adı), mtg'nin belgelenmiş tarama aralığı ve tekrar sayısı, bir DNS-over-HTTPS çözümleyici, 5s saat kayması toleransı, 8192 bağlantı sınırı ve bu sunucunun genel adresleri — böylece mtg başlangıçta bunları harici bir servise sormaz. Her iki savunma açık kalır. Size bırakılanlar: örtü sunucusu ve portu (yalnızca örtü alan adının DNS'i engellendiğinde veya bu sunucuya döndüğünde gerekir), iki PROXY protocol anahtarı (yalnızca NGINX veya yük dengeleyici arkasında), IP tercihi (yalnızca IPv6 bozuksa), dinamik TLS kayıt boyutu (yalnızca taklit edilen site kullanıyorsa) ve engel listesi adresleri (mtg kendi listesiyle gelir)."
"fillRecommendedDone" = "Önerilen değerler dolduruldu — alanları kontrol edip kaydedin"
"defenseHint" = "Aşağıdakilerin tümü isteğe bağlıdır; boş bırakılan alan üretilen yapılandırmaya yazılmaz ve mtg kendi varsayılanında kalır. Bunlar, sansür imza aramayı bırakıp davranışa göre sınıflandırmaya başladığında önem kazanan ayarlardır."
"frontingHost" = "Örtü sunucusu"
"frontingHostDesc" = "FakeTLS el sıkışmasını geçemeyen bir bağlantının — etkin bir yoklayıcının veya portu tarayan birinin — yönlendirileceği yer. Bu olmadan mtg bağlantıyı düşürür, ki bu da tanınabilir bir yanıttır. Gerçek bir siteye yönlendirin (yerel bir NGINX veya örtü alan adının kendi adresi). Boş = mtg örtü alan adını gizli anahtardan çözümler."
"frontingHostPlaceholder" = "127.0.0.1 veya bir sunucu adı"
"frontingPort" = "Örtü portu"
"frontingProxyProtocol" = "Örtü sunucusuna PROXY protocol"
"frontingProxyProtocolDesc" = "Örtü sitesiyle PROXY protocol konuşarak gerçek istemci adresini görmesini sağlar. Yalnızca o site bunu bekliyorsa açın."
"proxyProtocolListener" = "PROXY protocol kabul et"
"proxyProtocolListenerDesc" = "Bu vekil bir NGINX stream veya TCP yük dengeleyici arkasındaysa açın — MTProto'nun aynı adreste gerçek bir web sitesiyle 443 portunu paylaşması böyle olur. Doğrudan bağlantılarda açmayın: el sıkışma başarısız olur."
"doppelganger" = "Trafik biçimi taklidi"
"doppelUrls" = "Taklit edilecek adresler"
"doppelUrlsDesc" = "Her satırda bir HTTPS adresi. mtg bunları tarar ve paketleri arasındaki gecikmeleri yeniden üretir; böylece oturumun zamanlama profili vekil gibi değil, o site gibi görünür. ↻ düğmesi örtü alan adını doldurur; ağır CDN dosyaları daha iyi istatistik verir. Boş = alt sistem boşta kalır."
"doppelUrlsFilled" = "Taklit hedefleri dolduruldu"
"doppelRepeats" = "Tur başına istek"
"doppelRaidEach" = "Turlar arası aralık"
"doppelDrs" = "Dinamik TLS kayıt boyutu"
"doppelDrsDesc" = "Küçük TLS kayıtlarıyla başlayıp büyütür; Go sunucuları ve yamalı NGINX böyle yapar. Çoğu yığın (NGINX, Apache, OpenSSL) her zaman en büyük boyutu kullanır, bu yüzden yalnızca taklit edilen site böyle davranıyorsa açın."
"network" = "Ağ"
"preferIp" = "IP tercihi"
"preferIpDesc" = "mtg'nin Telegram'a hangi adres ailesiyle ulaşacağı. Sunucunun IPv6 yolu bozuk veya filtreliyse only-ipv4 seçin."
"mtgDefault" = "mtg varsayılanı"
"dns" = "Çözümleyici"
"dnsDesc" = "mtg örtü alan adını sistem çözümleyicisi yerine kendisi çözer. Yerel yanıt zehirlenmişse bir DNS-over-HTTPS veya DNS-over-TLS adresi girin (https://1.1.1.1, tls://1.1.1.1). Boş = mtg'nin kendi varsayılanı."
"timeSkew" = "Saat kayması toleransı"
"timeSkewDesc" = "FakeTLS şifreli bir zaman damgası taşır ve mtg bu pencerenin dışındaki mesajları reddeder — tekrar oynatılan yoklamaları bu durdurur. Yalnızca sunucu saati kayıyorsa artırın. Varsayılan 3s."
"concurrency" = "En fazla bağlantı"
"concurrencyDesc" = "Bu vekilin kabul ettiği eşzamanlı bağlantı sayısı; gerisi düşürülür. 0 = mtg varsayılanı (8192)."
"publicIpv4" = "Genel IPv4"
"publicIpv6" = "Genel IPv6"
"publicIpDesc" = "Bu sunucunun erişilebilir adresleri. Boş bırakılırsa mtg başlangıçta bunları harici bir servise sorar — o isteği tamamen önlemek için elle girin."
"autoDetect" = "otomatik belirle"
"filters" = "Filtreler"
"antiReplay" = "Tekrar önleme önbelleği"
"antiReplayDesc" = "Her bağlantının ilk baytlarını hatırlar ve tekrarı reddeder; etkin yoklama böyle etkisiz kalır. Varsayılan olarak açık; kapatmak için nadiren bir neden vardır."
"blocklist" = "IP engel listesi"
"blocklistDesc" = "Listelenen ağlardaki istemciler el sıkışma alamaz — örtü sitesine yönlendirilirler. FireHOL level 1 ile varsayılan olarak açıktır; bu liste özel ağları da içerir, aynı yerel ağdan bağlanıyorsanız kapatın."
