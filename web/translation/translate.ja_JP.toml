"i2to5Desc" = "（I2-I5）ハンドシェイク前に I1 とともに送られる追加の署名パケット。生成器は各パケットに別プロトコルの先頭バイト（QUIC、STUN、DTLS）を与え、流れの冒頭が検閲がすでに通しているものとして読めるようにします。サーバーと一致させる必要はありません。受信側は検証しないからです。タグ：<b 0xHEX> 固定バイト、<r N> 乱数バイト、<c> カウンター、<t> タイムスタンプ。空欄は書き込まれず、AmneziaVPN 5.18 より古いアプリは無視します。"
"awg3Unsupported" = "このサーバーの AmneziaWG は 3.0 には古すぎます。amneziawg-tools とカーネルモジュールを更新してください。インストール済み："
"off" = "無効"
"headerProtectionKeyDesc" = "AmneziaWG 3.0：パケットヘッダーを暗号化する base64 の 32 バイト鍵（ChaCha20）。両端で一致しなければならない唯一の 3.0 パラメーターで、これがないとクライアントは接続できません。S1-S4 が 12 以上である必要があります。空欄 = 無効。"
"contentPaddingAdditionDesc" = "AmneziaWG 3.0：暗号化部分の内側に加える追加パディング。単一値または 8-48 のような範囲。カーネルがセッションごとに新しい値を選びます。空欄 = カーネルの既定値。"
"rekeyAfterTimeDesc" = "AmneziaWG 3.0：鍵の更新が始まるまでの秒数（既定 120）。100-130 のような範囲にすると、その時点がセッションごとに変わります。RejectAfterTime より小さく保ってください。"
"rekeyTimeoutDesc" = "AmneziaWG 3.0：ハンドシェイク試行の間隔（秒、既定 5）。範囲を受け付けます。"
"rejectAfterTimeDesc" = "AmneziaWG 3.0：セッションが失効するまでの秒数（既定 180）。範囲を受け付けます。RekeyAfterTime より大きくしてください。"
"keepaliveTimeoutDesc" = "AmneziaWG 3.0：キープアライブパケットまでの秒数（既定 10）。範囲を受け付けます。"
"maxHandshakeAttemptsDesc" = "AmneziaWG 3.0：あきらめるまでのハンドシェイク試行回数（既定 18）。範囲を受け付けます。"
"randomTrailersDesc" = "AmneziaWG 3.0：パケットにランダムな末尾を付け、パケット長の繰り返しをなくします。"
"disableCookiesDesc" = "AmneziaWG 3.0：cookie 応答を無効にします。識別しやすいパケット種別が 1 つ減る代わりに、ハンドシェイク洪水に対する WireGuard の保護を失います。"

