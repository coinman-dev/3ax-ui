"hint" = "MTProto は、Xray ではなく外部の mtg サイドカーで動作する Telegram プロキシです。公開ポートとフロント用ドメインを選択してください。FakeTLS シークレットは保存時に生成され、1 つの Telegram リンクで共有されます。"
