"outboundTag" = "Outbound タグ"
"outboundTagDesc" = "このプロキシの Telegram トラフィックを送信する Xray の outbound（またはバランサー）のタグ。例えば Telegram に到達可能なサーバーへのチェーンなど。空のままにするとデフォルトの outbound が使用されます。"
"defense" = "ブロック対策 (mtg)"
"recommended" = "推奨設定"
"fillRecommended" = "推奨値を入力"
"fillRecommendedDesc" = "妥当な既定値がある項目をすべて入力します。模倣対象（このインバウンドのカバードメイン）、mtg が文書化しているクロール間隔と繰り返し回数、DNS-over-HTTPS リゾルバ、5s の時刻ずれ許容、8192 接続の上限、そしてこのサーバーの公開アドレス（起動時に外部サービスへ問い合わせないため）。2 つの防御は有効のままです。手入力に残すもの：フロンティングのホストとポート（カバードメインの DNS が遮断されている、またはこのサーバー自身を指す場合にのみ必要）、2 つの PROXY protocol スイッチ（NGINX やロードバランサーの背後にある場合のみ）、IP の優先（IPv6 が壊れている場合のみ）、動的 TLS レコードサイズ（模倣先サイトがそうしている場合のみ）、ブロックリストの URL（mtg は独自のリストを同梱）。"
"fillRecommendedDone" = "推奨値を入力しました。各項目を確認して保存してください"
"defenseHint" = "以下はすべて任意です。空欄なら生成される設定に書き込まれず、mtg は自身の既定値を保ちます。検閲が署名照合をやめ、振る舞いで分類し始めたときに効いてくる項目です。"
"frontingHost" = "フロンティング先ホスト"
"frontingHostDesc" = "FakeTLS ハンドシェイクに失敗した接続——能動的プローブや、ポートを走査した相手——の転送先。これがないと mtg は接続を切るだけで、それ自体が識別可能な応答になります。実在するサイト（ローカルの NGINX、またはカバードメイン自身のアドレス）を指定してください。空欄 = mtg がシークレットからカバードメインを解決します。"
"frontingHostPlaceholder" = "127.0.0.1 またはホスト名"
"frontingPort" = "フロンティング先ポート"
"frontingProxyProtocol" = "フロンティング先へ PROXY protocol"
"frontingProxyProtocolDesc" = "フロンティング先サイトと PROXY protocol で話し、実際のクライアントアドレスを見せます。そのサイトが要求している場合のみ有効にしてください。"
"proxyProtocolListener" = "PROXY protocol を受け付ける"
"proxyProtocolListenerDesc" = "このプロキシが NGINX stream や TCP ロードバランサーの背後にある場合に有効化します。MTProto が同一アドレス上の実サイトと 443 番ポートを共有できるのはこの仕組みです。直接接続では有効にしないでください。ハンドシェイクが失敗します。"
"doppelganger" = "トラフィック形状の模倣"
"doppelUrls" = "模倣する URL"
"doppelUrlsDesc" = "1 行に 1 つの HTTPS URL。mtg がそれらを巡回してパケット間の遅延を再現するため、セッションのタイミング特性はプロキシらしさを失い、そのサイトらしくなります。↻ ボタンはカバードメインを入力します。重い CDN ファイルほど統計が良くなります。空欄 = このサブシステムは休止します。"
"doppelUrlsFilled" = "模倣対象を入力しました"
"doppelRepeats" = "1 巡あたりのリクエスト数"
"doppelRaidEach" = "巡回の間隔"
"doppelDrs" = "動的 TLS レコードサイズ"
"doppelDrsDesc" = "小さな TLS レコードから始めて徐々に大きくします。Go 製サーバーやパッチ適用済み NGINX がこの方式です。多くの実装（NGINX、Apache、OpenSSL）は常に最大サイズを使うため、模倣先サイトがそうしている場合のみ有効にしてください。"
"network" = "ネットワーク"
"preferIp" = "IP の優先"
"preferIpDesc" = "mtg が Telegram に到達する際に使うアドレスファミリ。サーバーの IPv6 経路が壊れている、または遮断されている場合は only-ipv4 に固定してください。"
"mtgDefault" = "mtg の既定"
"dns" = "リゾルバ"
"dnsDesc" = "mtg はカバードメインをシステムのリゾルバではなく自前で解決します。ローカルの応答が汚染されている場合は DNS-over-HTTPS または DNS-over-TLS のエンドポイント（https://1.1.1.1、tls://1.1.1.1）を指定してください。空欄 = mtg 自身の既定値。"
"timeSkew" = "時刻ずれの許容"
"timeSkewDesc" = "FakeTLS は暗号化されたタイムスタンプを含み、mtg はこの範囲外のメッセージを拒否します。再生プローブを止めているのがこれです。サーバーの時計がずれている場合にのみ増やしてください。既定は 3s。"
