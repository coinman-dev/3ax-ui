"notifyClients" = "Повідомити клієнтів (Telegram)"
"notifyConfirm1" = "Надіслати зараз кожному пов’язаному з Telegram клієнту AWG його нову конфігурацію?"
"notifyConfirm2" = "Робіть це після переходу сервера на 2.0."
"notifyDone" = "Клієнтів повідомлено"
"s3Desc" = "AmneziaWG 2.0: випадковий паддінг для Cookie-пакетів (0-64). 0 = поведінка 1.x."
"s4Desc" = "AmneziaWG 2.0: випадковий паддінг для Data-пакетів (0-32). 0 = поведінка 1.x."
"i1Desc" = "AmneziaWG 2.0: CPS-пакет перед кожним рукостисканням, напр. <r 128> (N випадкових байтів). Порожньо = поведінка 1.x."
"i2to5Desc" = "(I2-I5) додаткові сигнатурні пакети перед рукостисканням, поряд з I1. Генератор дає кожному початкові байти іншого протоколу — QUIC, STUN, DTLS — щоб початок потоку читався як те, що цензор і так пропускає. Збігатися з сервером вони не мусять: отримувач їх не перевіряє. Теги: <b 0xHEX> — байти, <r N> — випадкові байти, <c> — лічильник, <t> — позначка часу. Порожні поля не пишуться, а застосунок старший за AmneziaVPN 5.18 їх ігнорує."
"awg3Unsupported" = "AmneziaWG на цьому сервері застарий для 3.0 — оновіть amneziawg-tools і модуль ядра. Встановлено:"
"off" = "вимкнено"
"headerProtectionKeyDesc" = "AmneziaWG 3.0: ключ base64 на 32 байти, що шифрує заголовок пакета (ChaCha20). Єдиний параметр 3.0, який мусить збігатися з обох боків — без нього клієнт не підключиться. Потребує S1-S4 не менше 12. Порожньо = вимкнено."
"contentPaddingAdditionDesc" = "AmneziaWG 3.0: додатковий паддінг усередині шифрованої частини. Одне значення або діапазон виду 8-48; ядро вибирає нове значення на кожну сесію. Порожньо = значення ядра."
"rekeyAfterTimeDesc" = "AmneziaWG 3.0: через скільки секунд починається зміна ключів (типово 120). Діапазон виду 100-130 робить момент різним для кожної сесії. Тримайте нижче за RejectAfterTime."
"rekeyTimeoutDesc" = "AmneziaWG 3.0: пауза між спробами рукостискання в секундах (типово 5). Приймає діапазон."
"rejectAfterTimeDesc" = "AmneziaWG 3.0: через скільки секунд сесія вважається завершеною (типово 180). Приймає діапазон. Має бути більше за RekeyAfterTime."
"keepaliveTimeoutDesc" = "AmneziaWG 3.0: пауза перед keepalive-пакетом у секундах (типово 10). Приймає діапазон."
"maxHandshakeAttemptsDesc" = "AmneziaWG 3.0: скільки спроб рукостискання робити (типово 18). Приймає діапазон."
"randomTrailersDesc" = "AmneziaWG 3.0: додавати випадковий «хвіст» до пакетів, щоб їхні розміри перестали повторюватися."
"disableCookiesDesc" = "AmneziaWG 3.0: вимкнути cookie-відповіді. Прибирає ще один розпізнаваний тип пакета ціною захисту WireGuard від флуду рукостисканнями."

