"notifyConfirm1" = "¿Enviar ahora a cada cliente AWG vinculado a Telegram su nueva configuración?"
"notifyConfirm2" = "Hágalo después de pasar el servidor a 2.0."
"notifyDone" = "Clientes notificados"
"s3Desc" = "AmneziaWG 2.0: relleno aleatorio para paquetes Cookie (0-64). 0 mantiene el comportamiento 1.x."
"s4Desc" = "AmneziaWG 2.0: relleno aleatorio para paquetes de datos (transporte) (0-32). 0 mantiene el comportamiento 1.x."
"i1Desc" = "AmneziaWG 2.0: paquete de firma CPS enviado antes de cada saludo, p. ej. <r 128> (N bytes aleatorios). Vacío mantiene el comportamiento 1.x."
"i2to5Desc" = "(I2-I5) paquetes de firma adicionales enviados antes del saludo, junto con I1. El generador da a cada uno los bytes iniciales de otro protocolo — QUIC, STUN, DTLS — para que el comienzo del flujo se lea como algo que la censura ya deja pasar. No tienen que coincidir con el servidor: el receptor nunca los valida. Etiquetas: <b 0xHEX> bytes literales, <r N> bytes aleatorios, <c> contador, <t> marca de tiempo. Los campos vacíos no se escriben, y una aplicación anterior a AmneziaVPN 5.18 los ignora."
"awg3Unsupported" = "El AmneziaWG de este servidor es demasiado antiguo para 3.0: actualice amneziawg-tools y el módulo del kernel. Instalado:"
"off" = "desactivado"
"headerProtectionKeyDesc" = "AmneziaWG 3.0: clave base64 de 32 bytes que cifra la cabecera del paquete (ChaCha20). El único parámetro 3.0 que debe coincidir en ambos extremos: sin él el cliente no puede conectarse. Requiere que S1-S4 sean de al menos 12. Vacío = desactivado."
"contentPaddingAdditionDesc" = "AmneziaWG 3.0: relleno adicional dentro de la parte cifrada. Un valor único o un rango como 8-48; el kernel elige un valor nuevo en cada sesión. Vacío = valor por defecto del kernel."
"rekeyAfterTimeDesc" = "AmneziaWG 3.0: segundos antes de que empiece la renovación de claves (por defecto 120). Un rango como 100-130 hace que el momento sea distinto en cada sesión. Manténgalo por debajo de RejectAfterTime."
"rekeyTimeoutDesc" = "AmneziaWG 3.0: segundos entre intentos de saludo (por defecto 5). Acepta un rango."
"rejectAfterTimeDesc" = "AmneziaWG 3.0: segundos hasta que la sesión expira (por defecto 180). Acepta un rango. Debe quedar por encima de RekeyAfterTime."
"keepaliveTimeoutDesc" = "AmneziaWG 3.0: segundos antes de un paquete keepalive (por defecto 10). Acepta un rango."
"maxHandshakeAttemptsDesc" = "AmneziaWG 3.0: intentos de saludo antes de rendirse (por defecto 18). Acepta un rango."
"randomTrailersDesc" = "AmneziaWG 3.0: añade una cola aleatoria a los paquetes, para que sus tamaños dejen de repetirse."
"disableCookiesDesc" = "AmneziaWG 3.0: desactiva las respuestas de cookie. Elimina un tipo de paquete reconocible, a costa de la protección de WireGuard frente a avalanchas de saludos."

