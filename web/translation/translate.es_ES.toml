[pages.inbounds.mtproto]
"hint" = "MTProto es un proxy de Telegram ejecutado por un sidecar externo mtg (no Xray). Elige un puerto público y un dominio de fachada; el secreto FakeTLS se genera al guardar y se comparte con un único enlace de Telegram."
"fakeTlsDomain" = "Dominio FakeTLS"
"fakeTlsDomainRandom" = "Elegir un dominio de fachada aleatorio"
"secret" = "Secreto"
"route" = "Enrutar a través de Xray"
"routeDesc" = "Conectar con Telegram a través del enrutador del núcleo en lugar de salir directamente. Usa esto cuando Telegram esté bloqueado en este servidor y quieras salir mediante una cadena de outbound."
"outboundTag" = "Etiqueta de outbound"
"outboundTagDesc" = "Etiqueta del outbound de Xray (o balanceador) al que enviar el tráfico de Telegram de este proxy — por ejemplo, una cadena hacia un servidor donde Telegram sea accesible. Déjalo vacío para usar el outbound predeterminado."
"defense" = "Anti-bloqueo (mtg)"
"recommended" = "Ajustes recomendados"
"fillRecommended" = "Rellenar valores recomendados"
"fillRecommendedDesc" = "Rellena todo lo que tiene un valor por defecto defendible: el objetivo de imitación (el dominio de cobertura de esta entrada), el intervalo de rastreo y las repeticiones documentados por mtg, un resolutor DNS-over-HTTPS, una tolerancia de desfase horario de 5s, el límite de 8192 conexiones y las direcciones públicas de este servidor, para que mtg no tenga que pedirlas a un servicio externo al arrancar. Ambas defensas quedan activas. Se dejan para usted: el host y el puerto de cobertura (solo necesarios si el DNS del dominio de cobertura está bloqueado o apunta a este mismo servidor), los dos interruptores de PROXY protocol (solo detrás de NGINX o un balanceador), la preferencia de IP (solo si el IPv6 está roto), el tamaño dinámico de registros TLS (solo si el sitio imitado lo usa) y las listas de bloqueo (mtg trae la suya)."
"fillRecommendedDone" = "Valores recomendados rellenados: revise los campos y guarde"
"defenseHint" = "Todo lo de abajo es opcional y, si se deja vacío, no se escribe en la configuración generada, así que mtg conserva su valor por defecto. Son los ajustes que importan cuando la censura deja de buscar firmas y empieza a clasificar por comportamiento."
"frontingHost" = "Host de cobertura"
"frontingHostDesc" = "A dónde se reenvía una conexión que no supera el saludo FakeTLS: un sondeo activo o cualquiera que escanee el puerto. Sin esto mtg simplemente corta la conexión, lo que ya es una respuesta reconocible. Apúntelo a un sitio real (un NGINX local o la propia dirección del dominio de cobertura). Vacío = mtg resuelve el dominio de cobertura a partir del secreto."
"frontingHostPlaceholder" = "127.0.0.1 o un nombre de host"
"frontingPort" = "Puerto de cobertura"
"frontingProxyProtocol" = "PROXY protocol hacia el host de cobertura"
"frontingProxyProtocolDesc" = "Hablar PROXY protocol con el sitio de cobertura para que vea la dirección real del cliente. Actívelo solo si ese sitio lo espera."
"proxyProtocolListener" = "Aceptar PROXY protocol"
"proxyProtocolListenerDesc" = "Actívelo si este proxy está detrás de un stream de NGINX o un balanceador TCP: así es como MTProto puede compartir el puerto 443 con un sitio web real en la misma dirección. No lo active con conexiones directas: el saludo fallaría."
"doppelganger" = "Imitación de la forma del tráfico"
"doppelUrls" = "URLs a imitar"
"doppelUrlsDesc" = "Una URL HTTPS por línea. mtg las rastrea y reproduce los retardos entre sus paquetes, de modo que el perfil temporal de la sesión deja de parecerse a un proxy y empieza a parecerse a ese sitio. El botón ↻ rellena el dominio de cobertura; los archivos grandes de CDN dan mejores estadísticas. Vacío = el subsistema queda inactivo."
"doppelUrlsFilled" = "Objetivos de imitación rellenados"
"doppelRepeats" = "Peticiones por ronda"
"doppelRaidEach" = "Intervalo entre rondas"
"doppelDrs" = "Tamaño dinámico de registros TLS"
"doppelDrsDesc" = "Empieza con registros TLS pequeños y va aumentando, como hacen los servidores en Go y NGINX parcheado. La mayoría de las pilas (NGINX, Apache, OpenSSL) usan siempre el tamaño máximo, así que actívelo solo si el sitio imitado lo hace."
"network" = "Red"
"preferIp" = "Preferencia de IP"
"preferIpDesc" = "Qué familia de direcciones usa mtg para llegar a Telegram. Fíjelo en only-ipv4 cuando la ruta IPv6 del servidor esté rota o filtrada."
"mtgDefault" = "predeterminado de mtg"
"dns" = "Resolutor"
"dnsDesc" = "mtg resuelve el dominio de cobertura por su cuenta, no a través del resolutor del sistema. Indique un extremo DNS-over-HTTPS o DNS-over-TLS (https://1.1.1.1, tls://1.1.1.1) cuando la respuesta local esté envenenada. Vacío = el valor por defecto de mtg."
"timeSkew" = "Tolerancia de desfase horario"
"timeSkewDesc" = "FakeTLS lleva una marca de tiempo cifrada y mtg rechaza los mensajes fuera de esta ventana: así se detienen los sondeos reproducidos. Auméntelo solo si el reloj del servidor se desvía. Por defecto 3s."
"concurrency" = "Conexiones máximas"
"concurrencyDesc" = "Cuántas conexiones simultáneas acepta este proxy; el resto se descarta. 0 = valor por defecto de mtg (8192)."
"publicIpv4" = "IPv4 pública"
"publicIpv6" = "IPv6 pública"
"publicIpDesc" = "Las direcciones accesibles de este servidor. Si se dejan en blanco, mtg las pide a un servicio externo al arrancar; indíquelas para evitar esa petición por completo."
"autoDetect" = "detectar automáticamente"
"filters" = "Filtros"
"antiReplay" = "Caché anti-repetición"
"antiReplayDesc" = "Recuerda los primeros bytes de cada conexión y rechaza las repeticiones, que es como se neutraliza el sondeo activo. Activado por defecto; rara vez hay motivo para desactivarlo."
"blocklist" = "Lista de bloqueo de IP"
"blocklistDesc" = "Los clientes de las redes listadas nunca reciben un saludo: se les envía al sitio de cobertura. Activada por defecto con FireHOL level 1, que incluye rangos privados: desactívela si se conecta desde la misma red local."
"blocklistUrls" = "URLs de listas de bloqueo"
"debug" = "Registro de depuración"
"debugDesc" = "Salida de mtg muy detallada. Actívelo solo mientras diagnostica algo."

