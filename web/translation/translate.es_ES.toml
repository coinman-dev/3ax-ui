"obfHint" = "Elija una generación y un preajuste, pulse Generar y guarde. Cambiar la ofuscación la cambia para TODOS los clientes: deben volver a importar su configuración o se desconectarán. H1-H4 aceptan un valor único (1.x) o un rango como 100000-800000 (2.0). La 3.0 añade cifrado de cabecera y temporizadores de protocolo aleatorizados; generarla regenera también el conjunto 2.0, porque la protección de cabecera necesita que S1-S4 sean lo bastante amplios para llevar su nonce. Los clientes necesitan una aplicación que soporte 3.0."
