"hint" = "MTProto 是由外部 mtg sidecar 執行的 Telegram 代理（並非 Xray）。請選擇一個公開連接埠與一個偽裝網域；FakeTLS 密鑰會在儲存時產生，並透過單一 Telegram 連結分享。"
