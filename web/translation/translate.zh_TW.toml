"outboundTag" = "Outbound 標籤"
"outboundTagDesc" = "用於傳送此代理 Telegram 流量的 Xray outbound（或負載平衡器）標籤——例如連往可存取 Telegram 之伺服器的鏈路。留空則使用預設 outbound。"
"defense" = "抗封鎖 (mtg)"
"recommended" = "建議設定"
"fillRecommended" = "填入建議值"
"fillRecommendedDesc" = "填入所有有合理預設值的項目：模仿目標（本入站的偽裝網域）、mtg 文件中的抓取間隔與重複次數、DNS-over-HTTPS 解析器、5s 時間偏差容忍、8192 連線上限，以及本伺服器的公開位址——這樣 mtg 啟動時無需向外部服務查詢。兩項防護保持開啟。留給您自行填寫的是：偽裝主機與連接埠（僅當偽裝網域的 DNS 被封鎖或指回本機時才需要）、兩個 PROXY protocol 開關（僅在 NGINX 或負載平衡之後）、IP 偏好（僅當 IPv6 不通時）、動態 TLS 記錄大小（僅當被模仿的網站這樣做時），以及封鎖清單網址（mtg 自帶一份）。"
"fillRecommendedDone" = "已填入建議值——請檢查各欄位後儲存"
"defenseHint" = "以下全部為選填：留空則不會寫入產生的設定檔，mtg 保持自身預設值。當審查從比對特徵轉向依行為分類時，這些才是關鍵旋鈕。"
"frontingHost" = "偽裝主機"
"frontingHostDesc" = "未通過 FakeTLS 交握的連線會被轉送到哪裡——主動探測者，或任何掃描該連接埠的人。沒有它 mtg 會直接中斷連線，而這本身就是可辨識的回應。請指向真實網站（本機 NGINX，或偽裝網域自身的位址）。留空 = mtg 從密鑰解析偽裝網域。"
"frontingHostPlaceholder" = "127.0.0.1 或主機名稱"
"frontingPort" = "偽裝連接埠"
"frontingProxyProtocol" = "對偽裝主機使用 PROXY protocol"
"frontingProxyProtocolDesc" = "與偽裝網站之間使用 PROXY protocol，使其看到用戶端真實位址。僅當該網站需要時才開啟。"
"proxyProtocolListener" = "接受 PROXY protocol"
"proxyProtocolListenerDesc" = "當本代理位於 NGINX stream 或 TCP 負載平衡之後時開啟——MTProto 正是這樣與同一位址上的真實網站共用 443 連接埠。直連情境請勿開啟：交握會失敗。"
"doppelganger" = "流量形態模仿"
"doppelUrls" = "用於模仿的網址"
"doppelUrlsDesc" = "每行一個 HTTPS 網址。mtg 會抓取它們並重現封包之間的延遲，於是連線的時序特徵不再像代理，而像那個網站。↻ 按鈕會填入偽裝網域；體積較大的 CDN 檔案能提供更好的統計。留空 = 此子系統閒置。"
"doppelUrlsFilled" = "已填入模仿目標"
"doppelRepeats" = "每輪請求數"
"doppelRaidEach" = "每輪間隔"
"doppelDrs" = "動態 TLS 記錄大小"
"doppelDrsDesc" = "從較小的 TLS 記錄開始逐步增大，Go 伺服器和打過修補的 NGINX 就是這樣。多數實作（NGINX、Apache、OpenSSL）一律使用最大值，因此僅當被模仿的網站如此才開啟。"
"network" = "網路"
"preferIp" = "IP 偏好"
"preferIpDesc" = "mtg 使用哪一族位址連線 Telegram。當伺服器的 IPv6 路由損壞或被過濾時，固定為 only-ipv4。"
"mtgDefault" = "mtg 預設"
"dns" = "解析器"
"dnsDesc" = "mtg 自行解析偽裝網域，而不經過系統解析器。當本機回應被汙染時，請設定 DNS-over-HTTPS 或 DNS-over-TLS 端點（https://1.1.1.1、tls://1.1.1.1）。留空 = mtg 自身預設值。"
"timeSkew" = "時間偏差容忍"
"timeSkewDesc" = "FakeTLS 內含加密時間戳記，mtg 會拒絕該區間之外的訊息——正是這一點擋住了重播探測。僅當伺服器時鐘漂移時才提高。預設 3s。"
"concurrency" = "最大連線數"
