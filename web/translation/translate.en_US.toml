"proxyProtocolListener" = "Accept the PROXY protocol"
"proxyProtocolListenerDesc" = "Enable when this proxy sits behind an NGINX stream or a TCP load balancer — that is how MTProto can share port 443 with a real website on the same address. Do not enable it for direct connections: the handshake would fail."
"doppelganger" = "Traffic-shape mimicry"
"doppelUrls" = "URLs to mimic"
"doppelUrlsDesc" = "One HTTPS URL per line. mtg crawls them and reproduces the delays between their packets, so the session's timing profile stops looking like a proxy and starts looking like that site. The ↻ button fills in the cover domain; heavy CDN assets give better statistics. Empty = the subsystem stays idle."
