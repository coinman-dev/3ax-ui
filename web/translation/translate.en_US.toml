"doppelRepeats" = "Requests per raid"
"doppelRaidEach" = "Interval between raids"
"doppelDrs" = "Dynamic TLS record sizing"
"doppelDrsDesc" = "Start with small TLS records and ramp up, the way Go servers and patched NGINX do. Most stacks (NGINX, Apache, OpenSSL) always use the maximum size, so enable this only if the site being mimicked does."
"network" = "Network"
"preferIp" = "IP preference"
"preferIpDesc" = "Which address family mtg uses to reach Telegram. Pin it to only-ipv4 when the server's IPv6 route is broken or filtered."
"mtgDefault" = "mtg default"
"dns" = "Resolver"
"dnsDesc" = "mtg resolves the cover domain itself rather than through the system resolver. Set a DNS-over-HTTPS or DNS-over-TLS endpoint (https://1.1.1.1, tls://1.1.1.1) when the local answer is poisoned. Empty = mtg's own default."
