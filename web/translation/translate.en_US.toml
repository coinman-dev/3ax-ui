[pages.inbounds.mtproto]
"hint" = "MTProto is a Telegram proxy run by an external mtg sidecar (not Xray). Pick a public port and a fronting domain; the FakeTLS secret is generated on save and shared with one Telegram link."
"fakeTlsDomain" = "FakeTLS Domain"
"fakeTlsDomainRandom" = "Pick a random fronting domain"
"secret" = "Secret"
"route" = "Route through Xray"
"routeDesc" = "Dial Telegram through the core's router instead of going out directly. Use this when Telegram is blocked on this server and you want to egress via an outbound chain."
"outboundTag" = "Outbound tag"
"outboundTagDesc" = "Tag of the Xray outbound (or balancer) to send this proxy's Telegram traffic to — e.g. a chain to a server where Telegram is reachable. Leave empty to use the default outbound."
"defense" = "Anti-blocking (mtg)"
"recommended" = "Recommended settings"
"fillRecommended" = "Fill in recommended values"
"fillRecommendedDesc" = "Fills everything that has a defensible default: the mimicry target (this inbound's cover domain), mtg's documented crawl interval and repeats, a DNS-over-HTTPS resolver, a 5s time-skew tolerance, the 8192 connection cap, and this server's public addresses so mtg does not have to ask an external service for them at startup. Both defences stay on. Left for you: the fronting host and port (only needed when the cover domain's DNS is blocked or points back at this server), the two PROXY protocol switches (only behind NGINX or a load balancer), the IP preference (only when IPv6 is broken), dynamic TLS record sizing (only if the mimicked site uses it) and the blocklist URLs (mtg ships its own list)."
"fillRecommendedDone" = "Recommended values filled in — check the fields, then Save"
"defenseHint" = "Everything below is optional and left out of the generated config when empty, so mtg keeps its own default. These are the knobs that matter when a censor stops matching signatures and starts classifying by behaviour."
"frontingHost" = "Fronting host"
"frontingHostDesc" = "Where a connection that fails the FakeTLS handshake is forwarded — an active prober, or anyone scanning the port. Without it mtg simply drops the connection, which is itself a recognisable answer. Point it at a real site (a local NGINX, or the cover domain's own address). Empty = mtg resolves the cover domain from the secret."
