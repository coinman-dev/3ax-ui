[pages.inbounds.mtproto]
"hint" = "MTProto adalah proxy Telegram yang dijalankan oleh sidecar mtg eksternal (bukan Xray). Pilih port publik dan domain fronting; secret FakeTLS dibuat saat disimpan dan dibagikan dengan satu tautan Telegram."
"fakeTlsDomain" = "Domain FakeTLS"
"fakeTlsDomainRandom" = "Pilih domain fronting acak"
"secret" = "Secret"
"route" = "Rutekan melalui Xray"
"routeDesc" = "Hubungkan Telegram melalui router inti alih-alih keluar secara langsung. Gunakan ini ketika Telegram diblokir di server ini dan Anda ingin keluar melalui rantai outbound."
"outboundTag" = "Tag outbound"
"outboundTagDesc" = "Tag dari outbound Xray (atau balancer) untuk mengirim lalu lintas Telegram proxy ini — mis. rantai ke server tempat Telegram dapat diakses. Biarkan kosong untuk menggunakan outbound bawaan."
"defense" = "Anti-pemblokiran (mtg)"
"recommended" = "Pengaturan yang disarankan"
"fillRecommended" = "Isi nilai yang disarankan"
"fillRecommendedDesc" = "Mengisi semua yang punya nilai bawaan yang wajar: sasaran tiruan (domain samaran inbound ini), interval penjelajahan dan jumlah ulangan yang didokumentasikan mtg, resolver DNS-over-HTTPS, toleransi selisih waktu 5s, batas 8192 koneksi, dan alamat publik server ini — agar mtg tidak perlu menanyakannya ke layanan luar saat mulai. Kedua pertahanan tetap aktif. Diserahkan kepada Anda: host dan porta samaran (hanya perlu bila DNS domain samaran diblokir atau menunjuk balik ke server ini), dua sakelar PROXY protocol (hanya di belakang NGINX atau penyeimbang beban), preferensi IP (hanya bila IPv6 rusak), ukuran rekaman TLS dinamis (hanya bila situs yang ditiru memakainya), dan daftar blokir (mtg sudah membawa daftarnya sendiri)."
"fillRecommendedDone" = "Nilai yang disarankan telah diisi — periksa kolomnya, lalu Simpan"
"defenseHint" = "Semua di bawah ini opsional dan tidak ditulis ke konfigurasi bila dibiarkan kosong, sehingga mtg memakai nilai bawaannya. Inilah pengaturan yang penting ketika sensor berhenti mencari tanda tangan dan mulai menggolongkan berdasarkan perilaku."
"frontingHost" = "Host samaran"
"frontingHostDesc" = "Ke mana koneksi yang gagal jabat tangan FakeTLS diteruskan — penyelidik aktif, atau siapa pun yang memindai porta. Tanpa ini mtg hanya memutus koneksi, dan itu sendiri sudah jawaban yang mudah dikenali. Arahkan ke situs sungguhan (NGINX lokal, atau alamat domain samaran itu sendiri). Kosong = mtg menyelesaikan domain samaran dari rahasianya."
"frontingHostPlaceholder" = "127.0.0.1 atau nama host"
"frontingPort" = "Porta samaran"
"frontingProxyProtocol" = "PROXY protocol ke host samaran"
"frontingProxyProtocolDesc" = "Berbicara PROXY protocol dengan situs samaran agar ia melihat alamat klien yang sebenarnya. Aktifkan hanya bila situs itu mengharapkannya."
"proxyProtocolListener" = "Terima PROXY protocol"
"proxyProtocolListenerDesc" = "Aktifkan bila proksi ini berada di belakang NGINX stream atau penyeimbang beban TCP — begitulah MTProto berbagi porta 443 dengan situs web sungguhan pada alamat yang sama. Jangan aktifkan untuk koneksi langsung: jabat tangan akan gagal."
"doppelganger" = "Tiruan bentuk lalu lintas"
"doppelUrls" = "URL untuk ditiru"
"doppelUrlsDesc" = "Satu URL HTTPS per baris. mtg menjelajahinya dan meniru jeda antar paketnya, sehingga profil waktu sesi berhenti terlihat seperti proksi dan mulai terlihat seperti situs itu. Tombol ↻ mengisi domain samaran; berkas CDN yang besar memberi statistik lebih baik. Kosong = subsistem menganggur."
"doppelUrlsFilled" = "Sasaran tiruan telah diisi"
"doppelRepeats" = "Permintaan per putaran"
"doppelRaidEach" = "Jeda antar putaran"
"doppelDrs" = "Ukuran rekaman TLS dinamis"
"doppelDrsDesc" = "Mulai dengan rekaman TLS kecil lalu membesar, seperti server Go dan NGINX yang dipatch. Sebagian besar tumpukan (NGINX, Apache, OpenSSL) selalu memakai ukuran maksimum, jadi aktifkan hanya bila situs yang ditiru melakukannya."
"network" = "Jaringan"
"preferIp" = "Preferensi IP"
"preferIpDesc" = "Keluarga alamat mana yang dipakai mtg untuk mencapai Telegram. Pilih only-ipv4 bila rute IPv6 server rusak atau difilter."
"mtgDefault" = "bawaan mtg"
"dns" = "Resolver"
"dnsDesc" = "mtg menyelesaikan domain samaran sendiri, bukan melalui resolver sistem. Setel titik akhir DNS-over-HTTPS atau DNS-over-TLS (https://1.1.1.1, tls://1.1.1.1) bila jawaban lokal diracuni. Kosong = bawaan mtg sendiri."
"timeSkew" = "Toleransi selisih waktu"
"timeSkewDesc" = "FakeTLS membawa cap waktu terenkripsi dan mtg menolak pesan di luar jendela ini — itulah yang menghentikan penyelidikan yang diputar ulang. Naikkan hanya bila jam server melenceng. Bawaan 3s."
"concurrency" = "Koneksi maksimum"
"concurrencyDesc" = "Berapa koneksi serentak yang diterima proksi ini; sisanya dibuang. 0 = bawaan mtg (8192)."
"publicIpv4" = "IPv4 publik"
"publicIpv6" = "IPv6 publik"
"publicIpDesc" = "Alamat server ini yang dapat dijangkau. Bila dibiarkan kosong, mtg menanyakannya ke layanan luar saat mulai — isi agar permintaan itu tidak terjadi sama sekali."
"autoDetect" = "deteksi otomatis"
"filters" = "Filter"
"antiReplay" = "Tembolok anti-ulang"
"antiReplayDesc" = "Mengingat byte pertama setiap koneksi dan menolak ulangan, begitulah penyelidikan aktif dipatahkan. Aktif secara bawaan; jarang ada alasan untuk mematikannya."
"blocklist" = "Daftar blokir IP"
"blocklistDesc" = "Klien dari jaringan yang terdaftar tidak pernah mendapat jabat tangan — mereka diarahkan ke situs samaran. Aktif secara bawaan dengan FireHOL level 1, yang mencakup rentang privat: matikan bila Anda menyambung dari jaringan lokal yang sama."
"blocklistUrls" = "URL daftar blokir"
"debug" = "Log awakutu"
"debugDesc" = "Keluaran mtg yang sangat rinci. Aktifkan hanya saat mendiagnosis sesuatu."

