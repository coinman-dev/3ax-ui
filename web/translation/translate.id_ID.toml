"headerProtectionKeyDesc" = "AmneziaWG 3.0: kunci base64 32 byte yang mengenkripsi header paket (ChaCha20). Satu-satunya parameter 3.0 yang harus sama di kedua ujung — tanpanya klien tidak bisa menyambung. Memerlukan S1-S4 minimal 12. Kosong = mati."
"contentPaddingAdditionDesc" = "AmneziaWG 3.0: pengisi tambahan di dalam bagian terenkripsi. Satu nilai atau rentang seperti 8-48; kernel memilih nilai baru setiap sesi. Kosong = bawaan kernel."
"rekeyAfterTimeDesc" = "AmneziaWG 3.0: berapa detik sebelum penggantian kunci dimulai (bawaan 120). Rentang seperti 100-130 membuat saatnya berbeda tiap sesi. Jaga di bawah RejectAfterTime."
"rekeyTimeoutDesc" = "AmneziaWG 3.0: detik antar percobaan jabat tangan (bawaan 5). Menerima rentang."
"rejectAfterTimeDesc" = "AmneziaWG 3.0: berapa detik sampai sesi kedaluwarsa (bawaan 180). Menerima rentang. Harus di atas RekeyAfterTime."
"keepaliveTimeoutDesc" = "AmneziaWG 3.0: detik sebelum paket keepalive (bawaan 10). Menerima rentang."
"maxHandshakeAttemptsDesc" = "AmneziaWG 3.0: jumlah percobaan jabat tangan sebelum menyerah (bawaan 18). Menerima rentang."
"randomTrailersDesc" = "AmneziaWG 3.0: menambahkan ekor acak pada paket, agar ukuran paket berhenti berulang."
"disableCookiesDesc" = "AmneziaWG 3.0: mematikan balasan cookie. Menghilangkan satu jenis paket yang mudah dikenali, dengan mengorbankan perlindungan WireGuard terhadap banjir jabat tangan."

