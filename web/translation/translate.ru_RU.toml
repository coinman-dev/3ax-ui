"s4Desc" = "AmneziaWG 2.0: случайный паддинг для Data-пакетов (0-32). 0 = поведение 1.x."
"i1Desc" = "AmneziaWG 2.0: CPS-пакет перед каждым хендшейком, напр. <r 128> (N случайных байт). Пусто = поведение 1.x."
"i2to5Desc" = "(I2-I5) дополнительные сигнатурные пакеты перед хендшейком, рядом с I1. Генератор даёт каждому начальные байты другого протокола — QUIC, STUN, DTLS — чтобы начало потока читалось как то, что цензор и так пропускает. Совпадать с сервером они не обязаны: получатель их не проверяет. Теги: <b 0xHEX> — байты, <r N> — случайные байты, <c> — счётчик, <t> — метка времени. Пустые поля не пишутся, а приложение старее AmneziaVPN 5.18 их игнорирует."
"awg3Unsupported" = "AmneziaWG на этом сервере слишком старый для 3.0 — обновите amneziawg-tools и модуль ядра. Установлено:"
"off" = "выключено"
"headerProtectionKeyDesc" = "AmneziaWG 3.0: ключ base64 на 32 байта, шифрующий заголовок пакета (ChaCha20). Единственный параметр 3.0, который должен совпадать на обеих сторонах — без него клиент не подключится. Требует S1-S4 не меньше 12. Пусто = выключено."
"contentPaddingAdditionDesc" = "AmneziaWG 3.0: дополнительный паддинг внутри шифрованной части. Одно значение или диапазон вида 8-48 — ядро выбирает новое значение на каждую сессию. Пусто = значение ядра."
"rekeyAfterTimeDesc" = "AmneziaWG 3.0: через сколько секунд начинается смена ключей (по умолчанию 120). Диапазон вида 100-130 делает момент разным для каждой сессии. Держите ниже RejectAfterTime."
"rekeyTimeoutDesc" = "AmneziaWG 3.0: пауза между попытками хендшейка в секундах (по умолчанию 5). Принимает диапазон."
"rejectAfterTimeDesc" = "AmneziaWG 3.0: через сколько секунд сессия считается истёкшей (по умолчанию 180). Принимает диапазон. Должно быть больше RekeyAfterTime."
"keepaliveTimeoutDesc" = "AmneziaWG 3.0: пауза перед keepalive-пакетом в секундах (по умолчанию 10). Принимает диапазон."
"maxHandshakeAttemptsDesc" = "AmneziaWG 3.0: сколько попыток хендшейка делать (по умолчанию 18). Принимает диапазон."
"randomTrailersDesc" = "AmneziaWG 3.0: добавлять случайный «хвост» к пакетам, чтобы их размеры перестали повторяться."
"disableCookiesDesc" = "AmneziaWG 3.0: отключить cookie-ответы. Убирает ещё один узнаваемый тип пакета ценой защиты WireGuard от флуда хендшейками."
