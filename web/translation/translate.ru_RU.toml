[pages.inbounds.mtproto]
"hint" = "MTProto — это прокси для Telegram, который запускает внешний процесс mtg (не Xray). Укажите публичный порт и домен прикрытия; секрет FakeTLS генерируется при сохранении и раздаётся одной ссылкой Telegram."
"fakeTlsDomain" = "Домен FakeTLS"
"fakeTlsDomainRandom" = "Выбрать случайный домен прикрытия"
"secret" = "Секрет"
"route" = "Маршрут через Xray"
"routeDesc" = "Подключаться к Telegram через маршрутизатор ядра, а не напрямую. Используйте, когда Telegram заблокирован на этом сервере и нужно выходить через цепочку outbound."
"outboundTag" = "Тег outbound"
"outboundTagDesc" = "Тег outbound (или балансировщика) Xray, куда направить Telegram-трафик этого прокси — например, цепочка на сервер, где Telegram доступен. Пусто — outbound по умолчанию."
"defense" = "Защита от блокировок (mtg)"
"recommended" = "Рекомендуемые настройки"
"fillRecommended" = "Заполнить рекомендуемыми"
"fillRecommendedDesc" = "Заполняет всё, у чего есть обоснованное значение по умолчанию: цель имитации (домен прикрытия этого инбаунда), задокументированные в mtg интервал обхода и число запросов, резолвер DNS-over-HTTPS, допуск времени 5s, предел в 8192 соединения и публичные адреса этого сервера — чтобы mtg не спрашивал их у внешнего сервиса при старте. Обе защиты остаются включёнными. Вручную остаются: хост и порт прикрытия (нужны, только если DNS домена прикрытия заблокирован или указывает на этот же сервер), оба переключателя PROXY protocol (только за nginx или балансировщиком), предпочтение IP (только при сломанном IPv6), динамический размер TLS-записей (только если так делает имитируемый сайт) и ссылки чёрного списка (у mtg есть свой список)."
"fillRecommendedDone" = "Рекомендуемые значения заполнены — проверьте поля и сохраните"
"defenseHint" = "Всё ниже необязательно: пустое поле не пишется в конфиг, и mtg остаётся на своём значении по умолчанию. Это те ручки, которые важны, когда цензор перестаёт искать сигнатуры и начинает классифицировать поведение."
"frontingHost" = "Хост прикрытия"
"frontingHostDesc" = "Куда отправить соединение, не прошедшее FakeTLS-рукопожатие — активный пробник или сканер порта. Без этого mtg просто рвёт связь, а это само по себе узнаваемый ответ. Укажите настоящий сайт (локальный NGINX или адрес домена прикрытия). Пусто — mtg резолвит домен из секрета."
"frontingHostPlaceholder" = "127.0.0.1 или имя хоста"
"frontingPort" = "Порт прикрытия"
"frontingProxyProtocol" = "PROXY protocol к хосту прикрытия"
"frontingProxyProtocolDesc" = "Говорить с сайтом прикрытия по PROXY protocol, чтобы он видел реальный адрес клиента. Включайте, только если тот сайт этого ждёт."
"proxyProtocolListener" = "Принимать PROXY protocol"
"proxyProtocolListenerDesc" = "Включите, если прокси стоит за nginx stream или TCP-балансировщиком — именно так MTProto делит порт 443 с настоящим сайтом на одном адресе. При прямых подключениях включать нельзя: рукопожатие сломается."
"doppelganger" = "Имитация формы трафика"
"doppelUrls" = "URL для имитации"
"doppelUrlsDesc" = "По одному HTTPS-адресу в строке. mtg обходит их и воспроизводит задержки между пакетами, так что тайминги сессии перестают выглядеть как прокси и начинают выглядеть как этот сайт. Кнопка ↻ подставляет домен прикрытия; тяжёлые файлы с CDN дают более точную статистику. Пусто — подсистема простаивает."
"doppelUrlsFilled" = "Цели имитации заполнены"
"doppelRepeats" = "Запросов за обход"
"doppelRaidEach" = "Интервал между обходами"
"doppelDrs" = "Динамический размер TLS-записей"
"doppelDrsDesc" = "Начинать с маленьких TLS-записей и наращивать, как делают серверы на Go и пропатченный NGINX. Большинство стеков (NGINX, Apache, OpenSSL) всегда используют максимальный размер, поэтому включайте, только если так делает имитируемый сайт."
"network" = "Сеть"
"preferIp" = "Предпочтение IP"
"preferIpDesc" = "Через какое семейство адресов mtg ходит в Telegram. Ставьте only-ipv4, если IPv6-маршрут на сервере сломан или фильтруется."
"mtgDefault" = "по умолчанию mtg"
"dns" = "Резолвер"
"dnsDesc" = "mtg резолвит домен прикрытия сам, а не через системный резолвер. Укажите DNS-over-HTTPS или DNS-over-TLS (https://1.1.1.1, tls://1.1.1.1), если локальный ответ отравлен. Пусто — значение mtg по умолчанию."
"timeSkew" = "Допуск рассинхронизации времени"
"timeSkewDesc" = "В FakeTLS зашита зашифрованная метка времени, и mtg отбрасывает сообщения вне этого окна — именно так отсекаются повторно проигранные пробы. Увеличивайте, только если часы сервера плывут. По умолчанию 3s."
"concurrency" = "Максимум соединений"
"concurrencyDesc" = "Сколько одновременных соединений принимает прокси; остальные отбрасываются. 0 — значение mtg по умолчанию (8192)."
"publicIpv4" = "Публичный IPv4"
"publicIpv6" = "Публичный IPv6"
"publicIpDesc" = "Внешние адреса этого сервера. Если не заданы, mtg спрашивает их у внешнего сервиса при старте — укажите явно, чтобы этот запрос не выполнялся вовсе."
"autoDetect" = "определить автоматически"
"filters" = "Фильтры"
"antiReplay" = "Кэш анти-повтора"
"antiReplayDesc" = "Запоминает первые байты каждого соединения и отклоняет повтор — так отбивается активное зондирование. Включено по умолчанию, выключать почти никогда не нужно."
"blocklist" = "Чёрный список IP"
"blocklistDesc" = "Клиенты из перечисленных сетей не получают рукопожатия — их уводит на сайт прикрытия. Включён по умолчанию со списком FireHOL level 1, куда входят и приватные сети: выключите, если подключаетесь из той же локальной сети."
