"modeShared" = "Двойной режим"
"modeSharedDesc" = "nginx забирает порт 443 и различает протоколы по имени сервера, которое присылает клиент. Инбаунд, стоявший на 443, переезжает на localhost; остальные остаются на своих портах и вдобавок отвечают на 443, поэтому уже розданные ссылки продолжают работать."
"modeOnly443" = "Только порт 443"
"modeOnly443Desc" = "Всё то же, что в двойном режиме, и вдобавок остальные порты закрываются. Каждый инбаунд, который сообщает имя сервера, уходит за 443; тот, что не умеет, — отключается. Закрытым это останется, только если вы потом подтвердите из панели: не подтвердите — всё вернётся."
"modeOnly443Hint" = "Один открытый порт. То, что за ним не спрячешь, работать перестанет."
"udpNote" = "AmneziaWG и WireGuard работают по UDP и делить TCP-порт не могут, поэтому в любом режиме остаются на своих портах."
"domain" = "Домен"
"domainDesc" = "Домен, на который сервер отвечает собственным сертификатом: заглушка, а позже и панель. Не должен совпадать ни с одним доменом прикрытия."
"certOk" = "Сертификат найден"
"certMissing" = "Для этого домена нет сертификата"
"certExpires" = "Сертификат действует до %s"
"publish" = "Что ещё публиковать на 443"
"subsPublish" = "Подписки"
"subsPublishDesc" = "Отдавать подписки на домене выше по порту 443. Собственный порт сервера подписок остаётся на месте, так что уже розданные ссылки не ломаются, — но в новых будет новый адрес."
"subsPublishNeedsDomain" = "Сначала укажите домен с сертификатом."
"panelPublish" = "Панель"
"panelPublishDesc" = "Отдавать панель на домене выше по порту 443, по её собственному базовому пути. Только в режиме «Только 443» — в двойном панель и так остаётся на своём порту."
"panelPublishNeedsOnly443" = "Только в режиме «Только 443» и только при домене с сертификатом."
"firewall" = "Закрытие остальных портов"
"firewallSwitch" = "Закрыть лишние порты"
"firewallDesc" = "Что останется открытым: SSH — всегда, на том порту, который указан в конфигурации самого sshd; порт панели, пока он не отдан за 443; подписки на тех же условиях; UDP-туннели; и DHCP, чтобы сервер не потерял свой адрес. Трафик, пришедший из туннеля, не трогается вовсе, как и ответы на то, что сервер запросил сам, — так что его собственные DNS, обновления и часы работают дальше. Всё остальное отвечать перестанет, а после применения панель попросит подтвердить, что она доступна."
"firewallExtra" = "Другие порты, которые оставить открытыми"
"firewallExtraDesc" = "Всё, за что должен отвечать именно этот сервер: почтовый релей, агент мониторинга, резолвер не для туннелей. Через запятую, можно диапазоны: 53, 8080, 9000-9100. Останутся открытыми и по TCP, и по UDP."
