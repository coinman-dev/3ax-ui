"presetMobile" = "شبكات الهاتف المحمول"
"notifyClients" = "إبلاغ العملاء (تلغرام)"
"notifyConfirm1" = "أُرسل الآن الإعداد الجديد إلى كل عميل AWG مرتبط بتلغرام؟"
"notifyConfirm2" = "افعل ذلك بعد نقل الخادم إلى 2.0."
"notifyDone" = "تم إبلاغ العملاء"
"s3Desc" = "AmneziaWG 2.0: حشو عشوائي لحزم Cookie (٠-٦٤). ٠ يحفظ سلوك 1.x."
"s4Desc" = "AmneziaWG 2.0: حشو عشوائي لحزم البيانات (النقل) (٠-٣٢). ٠ يحفظ سلوك 1.x."
"i1Desc" = "AmneziaWG 2.0: حزمة توقيع CPS تُرسل قبل كل مصافحة، مثل <r 128> (N بايت عشوائي). الفراغ يحفظ سلوك 1.x."
"i2to5Desc" = "(I2-I5) حزم توقيع إضافية تُرسل قبل المصافحة إلى جانب I1. يمنح المولِّد كل واحدة بايتات البداية لبروتوكول آخر — QUIC و STUN و DTLS — حتى تُقرأ بداية المسار كشيء تمرّره الرقابة أصلًا. ولا يلزم أن تطابق الخادم: فالمستقبِل لا يتحقق منها أبدًا. الوسوم: <b 0xHEX> بايتات ثابتة، <r N> بايتات عشوائية، <c> عدّاد، <t> طابع زمني. الحقول الفارغة لا تُكتب، والتطبيق الأقدم من AmneziaVPN 5.18 يتجاهلها."
"awg3Unsupported" = "إصدار AmneziaWG على هذا الخادم أقدم من أن يشغّل 3.0 — حدِّث amneziawg-tools ووحدة النواة. المثبَّت:"
"off" = "معطَّل"
"headerProtectionKeyDesc" = "AmneziaWG 3.0: مفتاح base64 بطول ٣٢ بايت يشفّر ترويسة الحزمة (ChaCha20). المعامل الوحيد في 3.0 الذي يجب أن يتطابق في الطرفين — وبدونه لا يستطيع العميل الاتصال. يستلزم أن تكون S1-S4 ١٢ على الأقل. فارغ = معطَّل."
"contentPaddingAdditionDesc" = "AmneziaWG 3.0: حشو إضافي داخل الجزء المشفَّر. قيمة واحدة أو مدى مثل 8-48؛ وتختار النواة قيمة جديدة لكل جلسة. فارغ = افتراضي النواة."
"rekeyAfterTimeDesc" = "AmneziaWG 3.0: بعد كم ثانية يبدأ تغيير المفاتيح (الافتراضي ١٢٠). مدى مثل 100-130 يجعل هذه اللحظة مختلفة في كل جلسة. أبقِه أقل من RejectAfterTime."
"rekeyTimeoutDesc" = "AmneziaWG 3.0: الثواني بين محاولات المصافحة (الافتراضي ٥). يقبل مدى."
"rejectAfterTimeDesc" = "AmneziaWG 3.0: بعد كم ثانية تُعدّ الجلسة منتهية (الافتراضي ١٨٠). يقبل مدى. ويجب أن يبقى أكبر من RekeyAfterTime."
"keepaliveTimeoutDesc" = "AmneziaWG 3.0: الثواني قبل حزمة keepalive (الافتراضي ١٠). يقبل مدى."
"maxHandshakeAttemptsDesc" = "AmneziaWG 3.0: عدد محاولات المصافحة قبل الاستسلام (الافتراضي ١٨). يقبل مدى."
"randomTrailersDesc" = "AmneziaWG 3.0: يضيف ذيلًا عشوائيًا إلى الحزم حتى تتوقف أحجامها عن التكرار."
"disableCookiesDesc" = "AmneziaWG 3.0: يوقف ردود cookie. يزيل نوع حزمة يمكن تمييزه، على حساب حماية WireGuard من سيل المصافحات."

