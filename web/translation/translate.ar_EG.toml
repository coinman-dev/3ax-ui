"obfHint" = "اختر الجيل والإعداد الجاهز، اضغط «توليد» ثم احفظ. تغيير التعمية يغيّره لجميع العملاء — عليهم إعادة استيراد إعداداتهم وإلا انقطعوا. تقبل H1-H4 قيمة واحدة (1.x) أو مدى مثل 100000-800000 (2.0). يضيف الإصدار 3.0 تشفير الترويسة ومؤقّتات بروتوكول معشَّاة؛ وتوليده يعيد توليد مجموعة 2.0 أيضًا، لأن حماية الترويسة تحتاج S1-S4 واسعة بما يكفي لحمل الـ nonce. ويحتاج العملاء تطبيقًا يدعم 3.0."
