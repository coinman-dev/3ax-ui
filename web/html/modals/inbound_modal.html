{{define "modals/inboundModal"}}
<a-modal
    id="inbound-modal"
    v-model="inModal.visible"
    :title="inModal.title"
    :dialog-style="{ top: '20px' }"
    @ok="inModal.ok"
    :confirm-loading="inModal.confirmLoading"
    :closable="true"
    :mask-closable="false"
    :class="themeSwitcher.currentTheme"
    :ok-text="inModal.okText"
    cancel-text='{{ i18n "close" }}'
    :ok-button-props="{ props: { disabled: (!inModal.isEdit && inbound.protocol === Protocols.AMNEZIAWG && app.dbInbounds && app.dbInbounds.some(db => db.protocol === Protocols.AMNEZIAWG)) || (!inModal.isEdit && inbound.protocol === Protocols.NATIVEWG && app.dbInbounds && app.dbInbounds.some(db => db.protocol === Protocols.NATIVEWG)) } }"
>
    {{template "form/inbound" .}}
</a-modal>
<script>
    // Make inModal globally available to ensure it works with any base path
    const inModal = (window.inModal = {
        title: "",
        visible: false,
        confirmLoading: false,
        okText: '{{ i18n "sure" }}',
        isEdit: false,
        confirm: null,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        async ok() {
            // Auto-generate the Reality keypair if the user picked Reality but
            // never clicked "Get New Cert": an empty privateKey makes Xray refuse
            // to start and takes every inbound down with it. Covers create + edit.
            const inb = inModal.inbound;
            if (
                inb &&
                inb.stream &&
                inb.stream.security === "reality" &&
                inb.stream.reality &&
                !inb.stream.reality.privateKey
            ) {
                await inboundModalVueInstance.getNewX25519Cert();
                if (!inb.stream.reality.privateKey) {
                    app.$message.error(
                        '{{ i18n "pages.inbounds.toasts.realityKeyError" }}',
                    );
                    return;
                }
            }
            ObjectUtil.execute(
                inModal.confirm,
                inModal.inbound,
                inModal.dbInbound,
            );
        },
        show({
            title = "",
            okText = '{{ i18n "sure" }}',
            inbound = null,
            dbInbound = null,
            confirm = (inbound, dbInbound) => {},
            isEdit = false,
        }) {
            this.title = title;
            this.okText = okText;
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            // Always ensure testseed is initialized for VLESS protocol (even if vision flow is not set yet)
            // This ensures Vue reactivity works properly
            if (
                this.inbound.protocol === Protocols.VLESS &&
                this.inbound.settings
            ) {
                if (
                    !this.inbound.settings.testseed ||
                    !Array.isArray(this.inbound.settings.testseed) ||
                    this.inbound.settings.testseed.length < 4
                ) {
                    // Create a new array to ensure Vue reactivity
                    this.inbound.settings.testseed = [
                        900, 500, 900, 256,
                    ].slice();
                }
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            this.confirm = confirm;
            this.visible = true;
            this.isEdit = isEdit;
            // The MTProto form offers the panel's own Xray outbound tags; fetch
            // them as the modal opens so the list is there on the first focus.
            if (
                this.inbound.protocol === Protocols.MTPROTO &&
                inboundModalVueInstance
            ) {
                inboundModalVueInstance.loadMtprotoOutboundTags();
            }
        },
        close() {
            inModal.visible = false;
            inModal.loading(false);
        },
        loading(loading = true) {
            inModal.confirmLoading = loading;
        },
        // Vision Seed methods - always available regardless of Vue context
        updateTestseed(index, value) {
            // Use inModal.inbound explicitly to ensure correct context
            if (!inModal.inbound || !inModal.inbound.settings) return;
            // Ensure testseed is initialized
            if (
                !inModal.inbound.settings.testseed ||
                !Array.isArray(inModal.inbound.settings.testseed)
            ) {
                inModal.inbound.settings.testseed = [900, 500, 900, 256];
            }
            // Ensure array has enough elements
            while (inModal.inbound.settings.testseed.length <= index) {
                inModal.inbound.settings.testseed.push(0);
            }
            // Update value
            inModal.inbound.settings.testseed[index] = value;
        },
        setRandomTestseed() {
            // Use inModal.inbound explicitly to ensure correct context
            if (!inModal.inbound || !inModal.inbound.settings) return;
            // Ensure testseed is initialized
            if (
                !inModal.inbound.settings.testseed ||
                !Array.isArray(inModal.inbound.settings.testseed) ||
                inModal.inbound.settings.testseed.length < 4
            ) {
                inModal.inbound.settings.testseed = [
                    900, 500, 900, 256,
                ].slice();
            }
            // Create new array with random values
            inModal.inbound.settings.testseed = [
                Math.floor(Math.random() * 1000),
                Math.floor(Math.random() * 1000),
                Math.floor(Math.random() * 1000),
                Math.floor(Math.random() * 1000),
            ];
        },
        resetTestseed() {
            // Use inModal.inbound explicitly to ensure correct context
            if (!inModal.inbound || !inModal.inbound.settings) return;
            // Reset testseed to default values
            inModal.inbound.settings.testseed = [900, 500, 900, 256].slice();
        },
    });

    // mtgUrlList reaches one of the MTProto URL lists without assuming the modal
    // currently holds an mtproto inbound — the computed properties below are
    // defined on the shared instance, and a protocol switch must not throw.
    function mtgUrlList(inbound, key, forWrite) {
        const owner = inbound && inbound.settings ? inbound.settings[key] : null;
        if (!owner) {
            return forWrite ? null : [];
        }
        if (forWrite) {
            return { owner };
        }
        return owner.urls || [];
    }

    // splitLines turns a textarea's contents into a list, dropping blank lines.
    function splitLines(value) {
        return String(value || "")
            .split("\n")
            .map(line => line.trim())
            .filter(line => line.length > 0);
    }

    // Store Vue instance globally to ensure methods are always accessible
    let inboundModalVueInstance = null;

    inboundModalVueInstance = new Vue({
        delimiters: ["[[", "]]"],
        el: "#inbound-modal",
        data: {
            inModal: inModal,
            delayedStart: false,
            mtprotoOutboundTags: [],
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            },
            get isEdit() {
                return inModal.isEdit;
            },
            get client() {
                return inModal.inbound &&
                    inModal.inbound.clients &&
                    inModal.inbound.clients.length > 0
                    ? inModal.inbound.clients[0]
                    : null;
            },
            get datepicker() {
                return app.datepicker;
            },
            get delayedExpireDays() {
                return this.client && this.client.expiryTime < 0
                    ? this.client.expiryTime / -86400000
                    : 0;
            },
            set delayedExpireDays(days) {
                this.client.expiryTime = -86400000 * days;
            },
            get externalProxy() {
                return this.inbound.stream.externalProxy.length > 0;
            },
            set externalProxy(value) {
                if (value) {
                    inModal.inbound.stream.externalProxy = [
                        {
                            forceTls: "same",
                            dest: window.location.hostname,
                            port: inModal.inbound.port,
                            remark: "",
                        },
                    ];
                } else {
                    inModal.inbound.stream.externalProxy = [];
                }
            },
        },
        watch: {
            "inModal.inbound.stream.security"(newVal, oldVal) {
                // Clear flow when security changes from reality/tls to none
                if (
                    inModal.inbound.protocol == Protocols.VLESS &&
                    !inModal.inbound.canEnableTlsFlow()
                ) {
                    inModal.inbound.settings.vlesses.forEach((client) => {
                        client.flow = "";
                    });
                }
            },
            // Ensure testseed is always initialized when vision flow is enabled
            "inModal.inbound.settings.vlesses": {
                handler() {
                    if (
                        inModal.inbound.protocol === Protocols.VLESS &&
                        inModal.inbound.settings &&
                        inModal.inbound.settings.vlesses
                    ) {
                        const hasVisionFlow =
                            inModal.inbound.settings.vlesses.some(
                                (c) =>
                                    c.flow === "xtls-rprx-vision" ||
                                    c.flow === "xtls-rprx-vision-udp443",
                            );
                        if (
                            hasVisionFlow &&
                            (!inModal.inbound.settings.testseed ||
                                !Array.isArray(
                                    inModal.inbound.settings.testseed,
                                ) ||
                                inModal.inbound.settings.testseed.length < 4)
                        ) {
                            inModal.inbound.settings.testseed = [
                                900, 500, 900, 256,
                            ];
                        }
                    }
                },
                deep: true,
            },
        },
        computed: {
            // The two URL lists are edited as text, one per line, and stored as
            // arrays. Blank lines are normal while typing and are dropped on the
            // way in, not while the operator is still editing.
            mtprotoDoppelUrlsText: {
                get() {
                    return mtgUrlList(this.inbound, "doppelganger").join("\n");
                },
                set(value) {
                    const list = mtgUrlList(this.inbound, "doppelganger", true);
                    if (list) list.owner.urls = splitLines(value);
                },
            },
            mtprotoBlocklistUrlsText: {
                get() {
                    return mtgUrlList(this.inbound, "blocklist").join("\n");
                },
                set(value) {
                    const list = mtgUrlList(this.inbound, "blocklist", true);
                    if (list) list.owner.urls = splitLines(value);
                },
            },
        },
        methods: {
            // Seed the doppelganger with the site this proxy already claims to
            // be: mtg mimics the timing of what it crawls, so the cover domain
            // is the one target guaranteed to match the SNI clients present.
            fillDoppelgangerPreset() {
                const domain = (this.inbound.settings.fakeTlsDomain || "").trim();
                if (!domain) {
                    return;
                }
                this.inbound.settings.doppelganger.urls = ["https://" + domain + "/"];
                if (!this.inbound.settings.doppelganger.repeatsPerRaid) {
                    this.inbound.settings.doppelganger.repeatsPerRaid = 10;
                }
                if (!this.inbound.settings.doppelganger.raidEach) {
                    this.inbound.settings.doppelganger.raidEach = "6h";
                }
            },
            streamNetworkChange() {
                if (!inModal.inbound.canEnableTls()) {
                    this.inModal.inbound.stream.security = "none";
                }
                if (!inModal.inbound.canEnableReality()) {
                    this.inModal.inbound.reality = false;
                }
                if (
                    this.inModal.inbound.protocol == Protocols.VLESS &&
                    !inModal.inbound.canEnableTlsFlow()
                ) {
                    this.inModal.inbound.settings.vlesses.forEach((client) => {
                        client.flow = "";
                    });
                }
                if (inModal.inbound.stream.network != "kcp") {
                    inModal.inbound.stream.finalmask.udp = [];
                }
            },
            SSMethodChange() {
                this.inModal.inbound.settings.password =
                    RandomUtil.randomShadowsocksPassword(
                        this.inModal.inbound.settings.method,
                    );

                if (this.inModal.inbound.isSSMultiUser) {
                    if (
                        this.inModal.inbound.settings.shadowsockses.length == 0
                    ) {
                        this.inModal.inbound.settings.shadowsockses = [
                            new Inbound.ShadowsocksSettings.Shadowsocks(),
                        ];
                    }
                    if (!this.inModal.inbound.isSS2022) {
                        this.inModal.inbound.settings.shadowsockses.forEach(
                            (client) => {
                                client.method =
                                    this.inModal.inbound.settings.method;
                            },
                        );
                    } else {
                        this.inModal.inbound.settings.shadowsockses.forEach(
                            (client) => {
                                client.method = "";
                            },
                        );
                    }
                    this.inModal.inbound.settings.shadowsockses.forEach(
                        (client) => {
                            client.password =
                                RandomUtil.randomShadowsocksPassword(
                                    this.inModal.inbound.settings.method,
                                );
                        },
                    );
                } else {
                    if (
                        this.inModal.inbound.settings.shadowsockses.length > 0
                    ) {
                        this.inModal.inbound.settings.shadowsockses = [];
                    }
                }
            },
            setDefaultCertData(index) {
                inModal.inbound.stream.tls.certs[index].certFile =
                    app.defaultCert;
                inModal.inbound.stream.tls.certs[index].keyFile =
                    app.defaultKey;
            },
            async getNewX25519Cert() {
                inModal.loading(true);
                const msg = await HttpUtil.get(
                    "/panel/api/server/getNewX25519Cert",
                );
                inModal.loading(false);
                if (!msg.success) {
                    return;
                }
                inModal.inbound.stream.reality.privateKey = msg.obj.privateKey;
                inModal.inbound.stream.reality.settings.publicKey =
                    msg.obj.publicKey;
            },
            clearX25519Cert() {
                this.inbound.stream.reality.privateKey = "";
                this.inbound.stream.reality.settings.publicKey = "";
            },
            async getNewmldsa65() {
                inModal.loading(true);
                const msg = await HttpUtil.get(
                    "/panel/api/server/getNewmldsa65",
                );
                inModal.loading(false);
                if (!msg.success) {
                    return;
                }
                inModal.inbound.stream.reality.mldsa65Seed = msg.obj.seed;
                inModal.inbound.stream.reality.settings.mldsa65Verify =
                    msg.obj.verify;
            },
            clearMldsa65() {
                this.inbound.stream.reality.mldsa65Seed = "";
                this.inbound.stream.reality.settings.mldsa65Verify = "";
            },
            randomizeRealityTarget() {
                if (typeof getRandomRealityTarget !== "undefined") {
                    const randomTarget = getRandomRealityTarget();
                    this.inbound.stream.reality.target = randomTarget.target;
                    this.inbound.stream.reality.serverNames = randomTarget.sni;
                }
            },
            // Suggestions for the MTProto "route through Xray" target: every
            // outbound in the panel's Xray config, plus every balancer — a
            // routing rule may point at either, and injectMtprotoEgress picks
            // the matching key. Fetched once per page; free text stays allowed,
            // since the tag may be added to the config afterwards.
            async loadMtprotoOutboundTags() {
                if (this.mtprotoOutboundTags.length > 0) {
                    return;
                }
                const msg = await HttpUtil.post("/panel/xray/");
                if (!msg.success) {
                    return;
                }
                let config;
                try {
                    config = JSON.parse(msg.obj).xraySetting;
                } catch (e) {
                    console.error("outbound tags: unparsable xray setting", e);
                    return;
                }
                if (typeof config === "string") {
                    try {
                        config = JSON.parse(config);
                    } catch (e) {
                        console.error("outbound tags: unparsable xray setting", e);
                        return;
                    }
                }
                if (!config) {
                    return;
                }
                const tags = [];
                const add = (tag) => {
                    if (tag && !tags.includes(tag)) {
                        tags.push(tag);
                    }
                };
                (config.outbounds || []).forEach((o) => add(o && o.tag));
                const balancers =
                    (config.routing && config.routing.balancers) || [];
                balancers.forEach((b) => add(b && b.tag));
                this.mtprotoOutboundTags = tags;
            },
            // Pick a fresh FakeTLS fronting domain for MTProto from the same
            // curated SNI list used by VLESS Reality.
            randomizeMtprotoDomain() {
                if (typeof getRandomRealityTarget !== "undefined") {
                    this.inbound.settings.fakeTlsDomain =
                        getRandomRealityTarget().sni;
                }
            },
            async getNewEchCert() {
                inModal.loading(true);
                const msg = await HttpUtil.post(
                    "/panel/api/server/getNewEchCert",
                    { sni: inModal.inbound.stream.tls.sni },
                );
                inModal.loading(false);
                if (!msg.success) {
                    return;
                }
                inModal.inbound.stream.tls.echServerKeys =
                    msg.obj.echServerKeys;
                inModal.inbound.stream.tls.settings.echConfigList =
                    msg.obj.echConfigList;
            },
            clearEchCert() {
                this.inbound.stream.tls.echServerKeys = "";
                this.inbound.stream.tls.settings.echConfigList = "";
            },
            async getNewVlessEnc() {
                const selected = inModal.inbound.settings.selectedAuth;
                if (!selected) {
                    this.clearVlessEnc();
                    return;
                }

                inModal.loading(true);
                const msg = await HttpUtil.get(
                    "/panel/api/server/getNewVlessEnc",
                );
                inModal.loading(false);

                if (!msg.success) {
                    return;
                }

                const auths = msg.obj.auths || [];
                const block = auths.find((a) => a.label === selected);

                if (!block) {
                    console.error("No auth block for", selected);
                    return;
                }

                inModal.inbound.settings.decryption = block.decryption;
                inModal.inbound.settings.encryption = block.encryption;
            },
            clearVlessEnc() {
                this.inbound.settings.decryption = "none";
                this.inbound.settings.encryption = "none";
                this.inbound.settings.selectedAuth = undefined;
            },
            // Vision Seed methods - must be in Vue methods for proper binding
            updateTestseed(index, value) {
                // Ensure testseed is initialized
                if (
                    !this.inbound.settings.testseed ||
                    !Array.isArray(this.inbound.settings.testseed)
                ) {
                    this.$set(
                        this.inbound.settings,
                        "testseed",
                        [900, 500, 900, 256],
                    );
                }
                // Ensure array has enough elements
                while (this.inbound.settings.testseed.length <= index) {
                    this.inbound.settings.testseed.push(0);
                }
                // Update value using Vue.set for reactivity
                this.$set(this.inbound.settings.testseed, index, value);
            },
            setRandomTestseed() {
                // Create new array with random values and use Vue.set for reactivity
                const newSeed = [
                    Math.floor(Math.random() * 1000),
                    Math.floor(Math.random() * 1000),
                    Math.floor(Math.random() * 1000),
                    Math.floor(Math.random() * 1000),
                ];
                this.$set(this.inbound.settings, "testseed", newSeed);
            },
            resetTestseed() {
                // Reset testseed to default values using Vue.set for reactivity
                this.$set(
                    this.inbound.settings,
                    "testseed",
                    [900, 500, 900, 256],
                );
            },
        },
    });
</script>
{{end}}
