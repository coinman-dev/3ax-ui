map $ssl_preread_server_name $threeax_upstream {
    hostnames;

    # ru-vpn (VLESS Reality)
    apple.com 127.0.0.1:8443;
    www.icloud.com 127.0.0.1:8443;

    # Telegram-via-nl (MTProto)
    www.samsung.com 127.0.0.1:8081;

    default 127.0.0.1:8443;
}

server {
    listen 443;
    listen [::]:443;

    ssl_preread on;
    proxy_pass $threeax_upstream;
    proxy_protocol on;
    proxy_timeout 300s;
    proxy_connect_timeout 5s;
}

# Telegram-via-nl (MTProto) — keeps its own port, so the PROXY header is taken off here
server {
    listen 127.0.0.1:8081 proxy_protocol;
    proxy_pass 127.0.0.1:4343;
    proxy_timeout 300s;
    proxy_connect_timeout 5s;
}
