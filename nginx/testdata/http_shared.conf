server {
    listen 127.0.0.1:8080 ssl proxy_protocol;
    server_name net-ru.modulator.net;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /root/cert/net-ru.modulator.net/fullchain.pem;
    ssl_certificate_key /root/cert/net-ru.modulator.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:threeax:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    access_log off;
    server_tokens off;

    root /usr/local/x-ui/www;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
